 dau_land_category_economy_on:0 "[GetPlayer.MakeScope.Var('dau_land_category_economy').GetValue|0] 经济"
 dau_land_category_military:0 "[GetPlayer.Custom('dau_land_category_military_text')]"
 dau_land_category_military_off:0 "军事"
 dau_land_category_military_on:0 "[GetPlayer.MakeScope.Var('dau_land_category_military').GetValue|0] 军事"
