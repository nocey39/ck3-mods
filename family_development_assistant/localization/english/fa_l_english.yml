l_english:
 fa_settings_decision:0 "Character Development Assistant Settings"
 fa_settings_decision_desc:0 "Set up education, lifestyle perk automation and genetic matchmaking for selected characters."
 fa_settings_decision_tooltip:0 "Open the settings window"
 fa_settings_decision_confirm:0 "Open Settings"
 fa_panel_title:0 "Character Development Assistant"
 fa_master_label:0 "Enable Character Development Assistant"
 fa_master_help:0 "Turn off the assistant to pause automation and keep your settings."
 fa_check_help:0 "Run enabled guardian, perk and matchmaking tasks now. Matchmaking checks one character at a time."
 fa_education_heading:0 "Child education"
 fa_perk_heading:0 "Lifestyle perks"
 fa_perk_follow_label:0 "Spend points in the focus tree"
 fa_perk_follow_help:0 "Spend points in the current focus tree in prerequisite order. Stop when that tree is complete."
 fa_perk_continue_label:0 "Continue in the education lifestyle"
 fa_perk_continue_help:0 "After the focus tree is complete, continue through the other trees in game order if your education and current lifestyle match."
 fa_perk_convert_label:0 "Convert unspent points from other lifestyles"
 fa_perk_convert_help:0 "Convert all unspent points from other lifestyles to the current lifestyle at a 1:1 rate. Unlocked perks are kept."
 fa_perk_priority_note:0 "Point conversion runs before automatic spending. You can spend points manually if a focus has no matching tree."
 fa_marriage_heading:0 "Marriage"
 fa_marriage_label:0 "Enable genetic matchmaking"
 fa_marriage_help:0 "Rank candidates by intelligence, physique, beauty, Pure-blooded and Fecund. Aim for the Strengthen Bloodline requirements first, then for all five traits."
 fa_marriage_note:0 "Select any combination. One character is checked each month. Review matches for yourself, your player heir and other couples who need confirmation."
 fa_marriage_scope_self:0 "Player character"
 fa_marriage_scope_self_help:0 "Find a spouse for the current player character and review the match in the standard marriage window."
 fa_marriage_scope_children:0 "Children"
 fa_marriage_scope_children_help:0 "Find spouses for adult children of your dynasty whose marriages you can arrange."
 fa_marriage_scope_relatives:0 "Other close relatives at court"
 fa_marriage_scope_relatives_help:0 "Find spouses for adult close relatives of your dynasty at your court. Your children have a separate setting."
 fa_marriage_review:0 "Review Pending Match"
 fa_marriage_review_help:0 "Open the standard marriage window for the next couple. Check the matrilineal option for women marrying outside the dynasty."
 fa_guardians_label:0 "Assign missing guardians"
 fa_guardians_help:0 "Checks immediately when enabled and monthly thereafter. Only eligible children at your court without guardians are assigned."
 fa_heir_label:0 "Include player heir"
 fa_heir_help:0 "Include your player heir at court in initial focus selection and guardian assignment. The heir gets first choice of available guardians."
 fa_check_now:0 "Check now"
 fa_mode_label:0 "Initial education focus"
 fa_default_note:0 "Game default when unselected"
 fa_mode_1:0 "By childhood trait"
 fa_mode_2:0 "One focus"
 fa_mode_1_help:0 "Choose one of each childhood trait's two preferred focuses."
 fa_mode_2_help:0 "Assign one initial focus to every eligible child."
 fa_skill_diplomacy:0 "Diplomacy"
 fa_skill_martial:0 "Martial"
 fa_skill_stewardship:0 "Stewardship"
 fa_skill_intrigue:0 "Intrigue"
 fa_skill_learning:0 "Learning"
 fa_fixed_diplomacy_help:0 "Bossy children have a disadvantage in Diplomacy education."
 fa_fixed_martial_help:0 "Curious children have a disadvantage in Martial education."
 fa_fixed_stewardship_help:0 "Charming children have a disadvantage in Stewardship education."
 fa_fixed_intrigue_help:0 "Pensive children have a disadvantage in Intrigue education."
 fa_fixed_learning_help:0 "Rowdy children have a disadvantage in Learning education."
 fa_fixed_note:0 "The chosen focus applies to all eligible children at their first selection. Childhood trait penalties still apply. Hover over a focus for details."
 fa_initial_only_note:0 "Click a selected option again to clear it. Initial focus only."
