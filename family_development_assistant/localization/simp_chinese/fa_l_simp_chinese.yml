l_simp_chinese:
 fa_settings_decision:0 "角色发展助手设置"
 fa_settings_decision_desc:0 "设置本廷子女的教育与监护、玩家角色的自动加点，以及指定角色的遗传配对。"
 fa_settings_decision_tooltip:0 "打开独立设置窗口"
 fa_settings_decision_confirm:0 "打开设置"
 fa_panel_title:0 "角色发展助手"
 fa_master_label:0 "启用角色发展助手"
 fa_master_help:0 "关闭总开关会暂停全部自动化，并保留下面的设置。"
 fa_check_help:0 "立即运行已启用的监护补位、自动加点和遗传配对。配对每次检查一名角色。"
 fa_education_heading:0 "子女教育"
 fa_perk_heading:0 "自动加点"
 fa_perk_follow_label:0 "跟随重心加点"
 fa_perk_follow_help:0 "使用当前生活方式的点数，按前置条件逐个解锁当前重心对应的技能树。该树点满后停下。"
 fa_perk_continue_label:0 "点满后继续点教育系"
 fa_perk_continue_help:0 "重心树点满，且当前生活方式与教育特质同系时，按原版显示顺序继续点其他树。"
 fa_perk_convert_label:0 "置换其他系的未用点数"
 fa_perk_convert_help:0 "每次检查将其他生活方式尚未花掉的点数按 1:1 转入当前生活方式。已解锁的技能会保留。"
 fa_perk_priority_note:0 "两项同时启用时，先置换点数，再自动加点。没有对应技能树的重心可手动加点。"
 fa_marriage_heading:0 "婚配"
 fa_marriage_label:0 "启用遗传配对"
 fa_marriage_help:0 "根据智力、体格、容貌、纯血和多产评估候选。先争取达到加强血脉的遗传条件，再追求五项齐全。"
 fa_marriage_note:0 "范围可多选，每月轮查一人。符合条件的配对会自动提议。本人、玩家继承人和需要确认婚姻形式的配对，可在此查看。"
 fa_marriage_scope_self:0 "本人"
 fa_marriage_scope_self_help:0 "为玩家当前扮演的角色寻找配偶，由你在原版窗口确认。"
 fa_marriage_scope_children:0 "子女"
 fa_marriage_scope_children_help:0 "为你有权安排婚事的同宗成年子女寻找配偶。"
 fa_marriage_scope_relatives:0 "其他本廷同宗近亲"
 fa_marriage_scope_relatives_help:0 "为本廷可由你安排婚事的同宗成年近亲寻找配偶，子女由单独的选项控制。"
 fa_marriage_review:0 "查看待确认配对"
 fa_marriage_review_help:0 "打开下一组待确认配对的原版婚姻窗口。女性与外宗族配对时，留意母系选项。"
 fa_guardians_label:0 "自动补监护人"
 fa_guardians_help:0 "开启时立即检查，以后每月检查。只为本廷缺监护人的适龄子女补位。"
 fa_heir_label:0 "纳入玩家继承人"
 fa_heir_help:0 "将本廷的玩家继承人纳入选科和补监护。开启补监护后，继承人优先获得空位。"
 fa_check_now:0 "立即检查"
 fa_mode_label:0 "首次教育方向"
 fa_default_note:0 "未选择时按原版规则"
 fa_mode_1:0 "按童年特质"
 fa_mode_2:0 "统一方向"
 fa_mode_1_help:0 "为每种童年特质在两个优势方向中预设一项。"
 fa_mode_2_help:0 "为纳入自动教育的孩子统一指定首次教育方向。"
 fa_skill_diplomacy:0 "外交"
 fa_skill_martial:0 "军事"
 fa_skill_stewardship:0 "管理"
 fa_skill_intrigue:0 "谋略"
 fa_skill_learning:0 "学识"
 fa_fixed_diplomacy_help:0 "专横的孩子在外交教育中有原版劣势。"
 fa_fixed_martial_help:0 "好奇的孩子在军事教育中有原版劣势。"
 fa_fixed_stewardship_help:0 "可爱的孩子在管理教育中有原版劣势。"
 fa_fixed_intrigue_help:0 "沉思的孩子在谋略教育中有原版劣势。"
 fa_fixed_learning_help:0 "闹腾的孩子在学识教育中有原版劣势。"
 fa_fixed_note:0 "所有纳入自动教育的孩子都按所选方向初次选科。童年特质的原版劣势依然生效，将鼠标移到各方向可查看。"
 fa_initial_only_note:0 "再点一次已选项可取消。策略只用于初次选科。"
