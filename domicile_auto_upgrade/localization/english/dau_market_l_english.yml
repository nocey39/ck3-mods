l_english:
 dau_market_settings_label:0 "Economic planning for direct holdings"
 dau_market_settings_help:0 "Plan projects using estimated tax returns, market supply and demand, and settlement conditions. Reserve inputs for work in progress. Your scope, construction preferences, Gold and Treasury reserves, and merchant commission settings still apply. Turning this off restores the previous construction priorities."
 dau_market_commission_label:0 "Commission merchants for supplies"
 dau_market_commission_help:0 "For an actual shortage, seek an eligible merchant tributary willing to accept. Pay the native Prestige cost only after the route is created and preserve your Prestige reserve."
 dau_market_commission_started_text:0 "A merchant was commissioned. Expansion will be reassessed after delivery."
 dau_market_status_display:0 "Economic planning · [GetPlayer.Custom('dau_market_status_text')]"
 dau_market_disabled_text:0 "Disabled."
 dau_market_relief_wait_text:0 "Supply projects started. Some projects are still waiting."
 dau_market_wait_text:0 "Some expansion is on hold pending supplies, Control or Popular Opinion."
 dau_market_holding_wait_text:0 "New holdings await relief from a food shortage or completion of an expansion in the same market."
 dau_land_status_market_wait:0 "Economic planning has deferred some projects."
 dau_econ_no_return_text:0 "The planner is saving funds while some affordable projects offer low estimated returns."
 dau_market_relief_text:0 "Projects that ease market shortages were prioritized."
 dau_market_committed_text:0 "Inputs have been reserved for projects under construction."
 dau_market_ready_text:0 "Direct holding projects will be evaluated by expected returns and market conditions."
 dau_econ_observation_display:0 "[GetPlayer.Custom('dau_econ_observation_text')]"
 dau_econ_observation_empty:0 "Monthly balances will be recorded at the first holding check."
 dau_econ_observation_gold:0 "@gold_icon! Gold net/month [GetPlayer.MakeScope.Var('dau_econ_gold_observed').GetValue|1+=] ([GetPlayer.MakeScope.Var('dau_econ_gold_observed_change').GetValue|1+=] since start)"
 dau_econ_observation_both:0 "$dau_econ_observation_gold$\n@treasury_icon! Treasury net/month [GetPlayer.MakeScope.Var('dau_econ_treasury_observed').GetValue|1+=] ([GetPlayer.MakeScope.Var('dau_econ_treasury_observed_change').GetValue|1+=] since start)"
 dau_econ_observation_help:0 "Observed monthly balances include all income and expenses for this ruler. The first observation is the baseline. Subsequent observations are taken during holding checks at least 30 days apart. Project return estimates are separate."
