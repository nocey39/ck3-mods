l_english:
 dejure_auto_settings_decision:0 "Realm Management Assistant Settings"
 dejure_auto_settings_decision_desc:0 "Configure normal vassal transfers or forced county organization between direct-vassal branches, with tier filters and personal protection."
 dejure_auto_settings_decision_tooltip:0 "Open Realm Management Assistant"
 dejure_auto_settings_decision_confirm:0 "Open settings"
 dejure_auto_panel_title:0 "Realm Management Assistant"
 dejure_auto_enabled_label:0 "Enable monthly organization"
 dejure_auto_enabled_help:0 "Paused, normal mode by default. Enabling checks at once, then monthly. Vassal, county and higher-title changes share 50 successes. County distribution is off by default. Settings pass to your heir."
 dejure_auto_check_now:0 "Organize now"
 dejure_auto_check_help:0 "Your county distribution works in both modes. Normal vassal eligibility stays unchanged. Forced mode organizes geographic titles. All changes share 50 successes per check. See Details."
 dejure_auto_overview:0 "Status: [GetPlayer.Custom('dejure_auto_status_text')]\n[GetPlayer.Custom('dejure_auto_feedback_short_text')]\nSee execution details for recorded reasons and titles."
 dejure_auto_status_off:0 "Paused"
 dejure_auto_status_waiting:0 "Waiting for the next monthly check"
 dejure_auto_status_ready:0 "Enabled"
 dejure_auto_rules_heading:0 "Organization rules"
 dejure_auto_rules:0 "Transfers move direct vassals by primary title, keeping eligibility.\nCounty distribution is opt-in; capital and higher titles stay.\nMissing recipients are skipped; 50 successes per check."
 dejure_auto_mode_heading:0 "Organization mode"
 dejure_auto_mode_0:0 "Normal transfers"
 dejure_auto_mode_1:0 "Force de jure hierarchy"
 dejure_auto_mode_0_help:0 "Moves whole direct vassals to the holder of their immediate de jure title; indirect vassals are never retracted. County distribution works independently and keeps the transfer rule."
 dejure_auto_mode_1_help:0 "Corrects misplaced secondary higher titles, then allegiance and counties. Higher titles go only to an existing in-realm de jure parent; primary titles and a higher ruler's last county are kept. No titles or characters are created and no de jure or succession edits."
 dejure_auto_tier_heading:0 "Direct-vassal tiers to process"
 dejure_auto_tier_help:0 "Normal: tier of transferred rulers. Forced: direct branches at the start of each check, including indirect holders; the round keeps its original scope and the next one re-reads the structure. Recipients are not filtered."
 dejure_auto_force_rules:0 "Secondary titles, then allegiance and counties; valid holdings are kept.\nMissing levels stay empty; without an in-realm lord, land goes direct.\nDomain kept by default; the toggle only gives out non-capital counties."
 dejure_auto_tier_county:0 "Counts"
 dejure_auto_tier_duchy:0 "Dukes"
 dejure_auto_tier_kingdom:0 "Kings"
 dejure_auto_tier_empire:0 "Emperors"
 dejure_auto_result_help:0 "See Details for the titles and reasons.\nNo recipient [GetPlayer.MakeScope.Var('dejure_auto_unassigned').GetValue|0] · Branch conflicts [GetPlayer.MakeScope.Var('dejure_auto_conflicts').GetValue|0] · Last county kept [GetPlayer.MakeScope.Var('dejure_auto_last_county_kept').GetValue|0]\nCategories may overlap or stay protected; from your domain [GetPlayer.MakeScope.Var('dejure_auto_last_player_counties').GetValue|0]."
 dejure_auto_report_changed_titles:0 "Transferred titles"
 dejure_auto_report_changed_people:0 "Rulers reassigned"
 dejure_auto_report_missing:0 "No recipient / legal superior held by you / leased"
 dejure_auto_report_conflict:0 "Primary title / branch conflicts"
 dejure_auto_report_last_county:0 "Last geographic county preserved"
 dejure_auto_report_protected:0 "Safety-limit records (not the current retention list)"
 dejure_auto_report_pending:0 "Batch limit reached; next check"
 dejure_auto_report_failed:0 "Still unresolved; inspect in game"
 dejure_auto_report_button:0 "Execution details"
 dejure_auto_report_title:0 "Last organization details"
 dejure_auto_report_back:0 "Back to settings"
 dejure_auto_report_hint:0 "Historical execution records, refreshed at the next valid check or succession. Current protection belongs to settings. Title links show current state, not historical holders."
 dejure_auto_report_current_holder:0 "Current holder: [Title.GetHolder.GetUIName]"
 dejure_auto_report_current_liege:0 "Current liege: [Character.GetLiege.GetUIName]"
 dejure_auto_distribute_domain:0 "Distribute your counties"
 dejure_auto_distribute_domain_help:0 "Off by default; both modes can use it. Gives non-capital counties to the nearest in-realm de jure lord, keeping any whose superior you hold or with no recipient. Capital and primary titles stay. Shares the 50-change budget; the domain limit does not stop it."
 dejure_auto_create_heading:0 "Create titles below your highest tier"
 dejure_auto_grant_heading:0 "Grant titles · Decentralization"
 dejure_auto_people_heading:0 "Unlanded candidates · Priority order"
 dejure_auto_create_duchy:0 "Duchies"
 dejure_auto_create_kingdom:0 "Kingdoms"
 dejure_auto_create_empire:0 "Empires"
 dejure_auto_grant_county:0 "Counties"
 dejure_auto_grant_duchy:0 "Duchies"
 dejure_auto_grant_kingdom:0 "Kingdoms"
 dejure_auto_grant_empire:0 "Empires"
 dejure_auto_people_direct:0 "Direct relatives (excluded when off)"
 dejure_auto_people_house:0 "House"
 dejure_auto_people_dynasty:0 "Dynasty"
 dejure_auto_people_noble:0 "Other nobles"
 dejure_auto_people_lowborn:0 "Lowborn"
 dejure_auto_people_culture:0 "Same culture"
 dejure_auto_people_faith:0 "Same faith"
 dejure_auto_unify_heading:0 "Vassal conversion"
 dejure_auto_unify_faith:0 "Unify faith"
 dejure_auto_unify_culture:0 "Unify culture"
 dejure_auto_unify_government:0 "Unify government"
 dejure_auto_unify_government_help:0 "Forces eligible AI vassals of count rank or higher throughout your realm to adopt your government. Theocratic and ecclesiastical vassals, protected vassals, and vassals under another player are exempt. Off by default. Runs during monthly automation or when you select Organize now."
 dejure_auto_unify_help:0 "Forces eligible AI vassals of count rank or higher throughout your realm to adopt your faith and rite or your culture. Protected vassals and branches under other players are exempt. Faith conversion also exempts clergy rulers, religious heads, and vassals with religious protections. Capitals and close family can convert under vanilla rules. Culture conversion applies to the vassal. Both options are off by default."
 dejure_auto_unify_summary:0 "Last pass: faith [GetPlayer.MakeScope.Var('dejure_auto_unify_force_faith_done').GetValue|0] · culture [GetPlayer.MakeScope.Var('dejure_auto_unify_force_culture_done').GetValue|0] · government [GetPlayer.MakeScope.Var('dejure_auto_unify_government_done').GetValue|0]"
 dejure_auto_title_cost_heading:0 "Title creation costs"
 dejure_auto_title_fee:0 "Cost percentage (0% free)"
 dejure_auto_title_reserve:0 "Reserve after payment"
 dejure_auto_create_help:0 "Creation and grants are independent and off by default. Runs with the monthly switch or Organize now. Creates only eligible geographic titles below your highest tier, never usurping; up to five per check."
 dejure_auto_grant_help:0 "Decentralised grants keep the core region, primary and primary-tier titles. With an available local county, a newcomer gets one county plus the higher title, without the county checkbox. Otherwise promote a lower-tier local ruler with fewer sub-realm counties. Waits when nobody qualifies."
 dejure_auto_people_help:0 "Unlanded adults are searched tier by tier: close kin, house, dynasty, other nobles, lowborn; disabled tiers are skipped. Searches your court, AI vassal courts and your guests. Culture and faith filter strictly; merit governments compare merit level, others stewardship."
 dejure_auto_direct_help:0 "Unlanded adult ancestors and descendants only, excluding siblings. Off by default; when off they are excluded from every fallback group. Spouses are always excluded."
 dejure_auto_title_cost_help:0 "One percentage for every creation tier. Base cost: duchy 150, kingdom 300, empire 600. The government determines whether treasury or gold pays. 0% is free. Native character, culture and building discounts do not stack. Charged only after a confirmed creation; grants are free."
 dejure_auto_title_result_help:0 "Last check's creation, grant bundles and creation spending. Waiting means no eligible candidate; unconfirmed means inspect the transaction. Up to 20 title changes per check; a higher title plus one county counts as two."
 dejure_auto_titles_summary:0 "Last: [GetPlayer.MakeScope.Var('dejure_auto_title_created').GetValue|0] created · [GetPlayer.MakeScope.Var('dejure_auto_title_granted').GetValue|0] grants\nCreation spent: [GetPlayer.MakeScope.Var('dejure_auto_title_paid').GetValue|0]\nWaiting: [GetPlayer.MakeScope.Var('dejure_auto_title_waiting').GetValue|0] · Unconfirmed: [GetPlayer.MakeScope.Var('dejure_auto_title_failed').GetValue|0]"
 dejure_auto_title_created_heading:0 "Last confirmed creations"
 dejure_auto_title_granted_heading:0 "Last confirmed grants (including county seats)"
 dejure_auto_title_waiting_heading:0 "Grant waiting: no eligible candidate"
 dejure_auto_title_failed_heading:0 "Unconfirmed grant: inspect in game"

