l_english:
 court_auto_settings_decision:0 "Council & Court Assistant Settings"
 court_auto_settings_decision_desc:0 "Fill council and court vacancies while keeping existing holders. Settings pass to the next played character after the player character dies."
 court_auto_settings_decision_tooltip:0 "Open the settings window"
 court_auto_settings_decision_confirm:0 "Open settings"
 court_auto_panel_title:0 "Council & Court Assistant"
 court_auto_enabled_label:0 "Enable automation"
 court_auto_enabled_help:0 "Paused initially. Enabling fills vacancies at once but dispatches no council tasks until Check now or the monthly check; staff then follow the chosen interval. Disabling keeps holders and tasks."
 court_auto_check_now:0 "Check now"
 court_auto_check_help:0 "Review enabled modules now: fill vacancies and replace better candidates where allowed. Restart the staff review interval. Also check task continuation, respecting manual task pauses."
 court_auto_status_display:0 "Status: [GetPlayer.Custom('court_auto_status_text')]"
 court_auto_last_display:0 "Last check: [GetPlayer.MakeScope.Var('court_auto_last_council').GetValue|0] councillors · [GetPlayer.MakeScope.Var('court_auto_last_court').GetValue|0] court appointments"
 court_auto_status_off:0 "Paused"
 court_auto_status_modules_off:0 "All modules disabled"
 court_auto_status_waiting:0 "Check complete; waiting for next check"
 court_auto_status_ready:0 "Enabled; awaiting a check"
 court_auto_council_label:0 "Council appointments and replacement"
 court_auto_council_help:0 "Enable council staff reviews. Select vacancies only or replacement below. Native appointment eligibility applies."
 court_auto_council_note:0 "Both modes use the selected priority. Fill vacancies first, then optionally compare current staff. Ties keep incumbents."
 court_auto_strategy_1:0 "Powerful vassals first"
 court_auto_strategy_0:0 "Highest skill first"
 court_auto_strategy_1_help:0 "Prefer eligible powerful vassals outside your current council, ranked by the relevant skill. Fall back to other eligible candidates."
 court_auto_strategy_0_help:0 "Compare the relevant skill of eligible candidates outside your current council."
 court_auto_council_scope_note:0 "Standard council, appointable chaplain, and additional ministry posts. Spouse and other special seats retain native handling."
 court_auto_court_label:0 "Court appointments and replacement"
 court_auto_court_help:0 "Enable court staff reviews, including multi-slot positions. Select vacancies only or replacement below. Native eligibility, multiple-job limits and RAW aptitude apply."
 court_auto_court_note:0 "Compare native RAW aptitude. Keep incumbents by default, and on all ties. Check physician and caravan leader first. Native multiple-job rules apply."
 court_auto_interval_label:0 "Check interval"
 court_auto_interval_1:0 "Monthly"
 court_auto_interval_6:0 "Every 6 months"
 court_auto_interval_12:0 "Yearly"
 court_auto_interval_help:0 "Enabling checks immediately. Changing the interval restarts the timer. Inherited settings receive an extra check one day after succession."
 court_auto_rules_label:0 "Appointment rules"
 court_auto_rules_note:0 "Switches, modes, priority and interval pass to your heir; switching to a living character does not copy them. Eligible candidates only, never recruited. Replacement may affect opinion, cost and task progress."
 court_auto_ui_overview:0 "Status: [GetPlayer.Custom('court_auto_status_text')]\nLast: Council [GetPlayer.MakeScope.Var('court_auto_last_council').GetValue|0] · Court [GetPlayer.MakeScope.Var('court_auto_last_court').GetValue|0] · Tasks [GetPlayer.MakeScope.Var('court_auto_last_tasks').GetValue|0]"
 court_auto_ui_appointments:0 "Staff settings"
 court_auto_ui_modules:0 "Modules"
 court_auto_ui_council:0 "Council"
 court_auto_ui_court:0 "Court positions"
 court_auto_ui_strategy:0 "Council priority"
 court_auto_ui_schedule:0 "Check schedule"
 court_auto_ui_interval_6:0 "6 months"
 court_auto_ui_monthly_note:0 "Monthly checks · Check now at any time"
 court_auto_ui_monthly_help:0 "Enabling checks at once, then monthly. Legacy half-yearly or yearly settings switch to monthly when settings open. Switches and council priority are kept; old tickets are invalidated."
 court_auto_ui_rules_open:0 "▾ Rules and details"
 court_auto_ui_rules_closed:0 "▸ Rules and details"
 court_auto_ui_rules_help:0 "Expand or collapse the details. This only changes the display, leaving appointments and saved settings unchanged."
 court_auto_ui_summary:0 "Keep staff by default · Replacement is opt-in · Native salaries"
 court_auto_tasks_heading:0 "Council task continuation"
 court_auto_tasks_help:0 "Scope per task: Domain, current de jure duchy, or current de jure kingdom; nothing highlighted means no continuation. Applies only after you assign the task; on completion it finds the next target in scope, own counties before vassals, and stops when none remain. Native eligibility and speed are unchanged."
 court_auto_task_scope_1:0 "Domain"
 court_auto_task_scope_2:0 "Duchy"
 court_auto_task_scope_3:0 "Kingdom"
 court_auto_task_status_off:0 "No range (not continued)"
 court_auto_task_status_master_off:0 "Master switch paused"
 court_auto_task_status_no_worker:0 "Waiting for councillor"
 court_auto_task_status_manual:0 "Paused after manual reassignment"
 court_auto_task_status_exhausted:0 "No targets left in the current range; use Check now or change the range"
 court_auto_task_status_working:0 "Working; keeping current task"
 court_auto_task_status_waiting:0 "Waiting for a check or eligible target"
 court_auto_task_conversion_label:0 "Convert faith"
 court_auto_task_conversion_help:0 "Status: [GetPlayer.Custom('court_auto_task_conversion_status')]\n$court_auto_tasks_help$\nDomain: counties you hold. Duchy/Kingdom: stay inside the de jure duchy/kingdom of the current target. Manual assignments win; Off stops continuation without cancelling the current task."
 court_auto_task_culture_label:0 "Promote culture"
 court_auto_task_culture_help:0 "Status: [GetPlayer.Custom('court_auto_task_culture_status')]\n$court_auto_tasks_help$\nDomain: counties you hold. Duchy/Kingdom: stay inside the de jure duchy/kingdom of the current target. Manual assignments win; Off stops continuation without cancelling the current task."
 court_auto_task_control_label:0 "Raise control"
 court_auto_task_control_help:0 "Status: [GetPlayer.Custom('court_auto_task_control_status')]\n$court_auto_tasks_help$\nDomain: counties you hold. Duchy/Kingdom: stay inside the de jure duchy/kingdom of the current target. Manual assignments win; Off stops continuation without cancelling the current task."
 court_auto_memory_label:0 "Remember Standing Council Tasks"
 court_auto_memory_help:0 "With automation enabled, observes the council on the personnel review schedule or when you click Check Now. Restores remembered standing tasks after temporary work or a change of councillor or ruler. Changes between observations may be missed."
 court_auto_review_council:0 "Council"
 court_auto_review_court:0 "Court"
 court_auto_review_mode_0:0 "Fill vacancies"
 court_auto_review_mode_1:0 "Replace if better"
 court_auto_review_council_help:0 "Vacancies only by default. Replacement fills vacancies, then compares incumbents with eligible candidates using your council priority; ties keep incumbents and no chain swaps occur. Protected or religiously restricted members are skipped. Replacement may interrupt task progress."
 court_auto_review_court_help:0 "Vacancies only by default. Replacement picks the higher native raw aptitude, ties keeping incumbents; multi-slot roles replace the weakest first. Uses native replacement, so revoke costs and opinion effects may apply; unaffordable swaps are skipped."
 court_auto_review_frequency:0 "Staff review interval"
 court_auto_review_interval_help:0 "Shared by council and court. Changing it restarts the timer; enabling the master switch or a module, the day after succession, and Check now each trigger one extra review. Scope buttons only check tasks; task continuation stays monthly."
 court_auto_review_tasks_note:0 "Personnel and standing tasks · Continuation stays monthly"

