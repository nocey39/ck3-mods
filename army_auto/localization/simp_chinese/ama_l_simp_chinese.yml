l_simp_chinese:
 ama_panel_title:0 "军队建设助手"
 ama_personal_row_label:0 "私人"
 ama_personal_row_help:0 "私人普通军团与冒险者普通自有军团。该行的新建、扩编只控制私人军团，独立于头衔兵士。"
 ama_title_row_label:0 "头衔"
 ama_create_label:0 "新建"
 ama_create_help:0 "按配比新建私人普通军团，独立于头衔新建和各项扩编。开启自动解散时，还会先清理本来源不符类别或策略的军团。所有模式共用每月20次额度、逐日确认。"
 ama_expand_label:0 "扩编"
 ama_expand_help:0 "扩编已选类别的私人军团：先读本队规模与上限，通过才扣费加一级；满额、超限或读取失败跳过。未集结且不在战斗才处理。0 份退出该类管理，配比不限制已有规模。"
 ama_titles_label:0 "自持头衔兵士"
 ama_titles_help:0 "头衔新建仍暂停，扩编读取每队最新原版上限，只管理自持且所属与控制头衔一致的已选类别。不扩编借调部队，超限军团保留。与私人共用预算与每月 20 次额度。"
 ama_title_create_label:0 "新建"
 ama_title_create_help:0 "逐头衔按适配后的原版规则推算名额并独立配兵，每队开工前重算，不用私人名额或界面旧快照。等级或家族能力未核实则跳过。所有来源共用预算与每月 20 次额度。"
 ama_title_expand_label:0 "扩编"
 ama_title_expand_help:0 "独立扩编已选类别的自持头衔兵士：由 GUI 宿主读取本队最新上限，回传后复核归属与预算再加一级。满额或超限不缩编，读取失败不扣费。"
 ama_create_disabled_hint:0 "新建已关闭。选择管理类别后可扩编；0份停止该类扩编。允许新建的来源若另开自动解散，会清理其0份类别军团。"
 ama_check_now:0 "立即检查"
 ama_check_help:0 "每月开始新一轮，空闲时每7天复查。成功操作每日继续，每月最多20次。扩编按本助手费用比例与储备判断，读取本队最新原版规模上限。"
 ama_status_display:0 "当前状态：[GetPlayer.Custom('ama_status')]"
 ama_status_help:0 "管理普通私兵、冒险者普通自有军团，以及另行启用的可管理自持头衔兵士；特殊军、事件军和受雇部队不参与。待确认时请避免手动招募或解散相同兵种，立即检查会暂时禁用。\n[GetPlayer.Custom('ama_receipt')]"
 ama_targets_label:0 "管理类别与新建比例"
 ama_targets_help:0 "正数决定新建比例，并允许扩编；0份停止该类新建和扩编。开启自动解散后，0份／未选类别的现有军团也会被拆除。"
 ama_target_step:0 "每次调整1份；0份停止新建与扩编，开启自动解散时还会清理该类现有军团。"
 ama_category_column:0 "兵种类别"
 ama_ratio_column:0 "管理／新建比例"
 ama_plan_column:0 "个人推算"
 ama_plan_summary:0 "个人军团：[GetPlayer.MakeScope.Var('ama_plan_used').GetValue|0]／[GetPlayer.MakeScope.Var('ama_plan_limit').GetValue|0] · 可分配 [GetPlayer.MakeScope.Var('ama_plan_capacity').GetValue|0] 队"
 ama_plan_help:0 "只显示私人新建计划：原生上限扣除其他占位，再按配比分配取整；暂不可招募类别保留配额。头衔新建已暂停，不占私人名额。改配比不会立即招募或扣费。"
 ama_categories_closed:0 "▸ 添加兵种类别"
 ama_categories_open:0 "▾ 收起添加菜单"
 ama_categories_help:0 "展开未参与自动新建的类别，点击一个即可按1份加入。类别不因缺钱或军团满额而消失；招募资格在执行时检查。"
 ama_add_help:0 "按1份配比加入新建方案，随后可用−／＋调整。这里只修改配置，不立即招募或扣费。未解锁类别也可预先配置，其个人配额保留到满足招募条件。"
 ama_strategy_label:0 "新军团选兵偏好"
 ama_strategy_0:0 "性价比优先"
 ama_strategy_1:0 "军队质量优先"
 ama_strategy_2:0 "数量优先"
 ama_strategy_help:0 "只比同类可招募兵种。每轮检查先读取当前未驻扎招募预览属性，轮内招募与扩编复用，下轮或立即检查时刷新，包含时代及角色加成；个人兵与头衔兵使用同一口径，不计驻扎及头衔专属加成。数量看一级费用与维护，性价比看整团战力÷（收费＋60 月维护），质量优先看单兵√（伤害×坚韧），攻城器械按整团排序；同分比攻城、追击、掩护。读取失败则停止本轮。"
 ama_fees_label:0 "费用与扩军预算"
 ama_cost_label:0 "费用比例（全部资源）"
 ama_cost_help:0 "按当前生效兵种定义的基础费用乘本比例手动扣费，0%为免费；额外角色折扣仍不计入。目录和费用定义由同步启动器在游戏启动前更新，日常维持费继续由游戏处理。"
 ama_upkeep_label:0 "扩军停止线（0忽略）"
 ama_upkeep_help:0 "未集结兵士维持费占收入达到此比例即停止扩军，0 忽略。无常规维护的政体跳过。只检查确有维持费的金币、威望与国库，储备另行判断，单次可能稍超线。"
 ama_percent_step:0 "每次调整10个百分点，范围0%～100%。"
 ama_budget_closed:0 "▸ 支付方式与资源储备"
 ama_budget_open:0 "▾ 支付方式与资源储备"
 ama_budget_help:0 "点击展开或收起高级预算设置。收起时这些设置仍生效。"
 ama_wallet_label:0 "招募支付方式"
 ama_wallet_help:0 "默认沿用军团原生资源（威望 ×2、交易品 ×1，其余金币）；头衔兵士按国库规则。也可手动指定。只影响新建与扩编付款，不改维持费。"
 ama_reserves_label:0 "资源储备 · 支付后至少保留"
 ama_reserves_help:0 "招募、扩编付款后至少保留这些余额。所有有费用的资源都须满足储备要求；这里不使用封臣资源。未使用的资源储备不阻止其他资源付款。"
 ama_reserve_step:0 "每次调整100，最低为0。"
 ama_reserve_step_label:0 "±100"
 ama_currency_gold:0 "金币"
 ama_currency_treasury:0 "国库"
 ama_currency_prestige:0 "威望"
 ama_currency_piety:0 "虔诚"
 ama_currency_barter_goods:0 "交易品"
 ama_notes:0 "每天最多1次 · 每月最多20次，次日确认\n基础费用×比例扣费；维持费由游戏处理。\n更改游戏或模组后，请从自动同步启动器进入游戏。"
 ama_compatibility_help:0 "不修改原版兵种、政体或窗口。其他模组新增兵种需要适配；修改兵种人数、属性或费用时，本助手的目录评分和手动费用不一定同步。军团创建和扩编保留原生资格检查，不强制补满士兵。"
