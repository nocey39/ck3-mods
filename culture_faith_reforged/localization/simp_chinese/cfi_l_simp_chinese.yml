l_simp_chinese:
 decision_group_type_cfi_management:0 "文化与信仰机制整合"
 tradition_cfi_integrated_name:0 "百川汇流"
 tradition_cfi_integrated_desc:0 "取诸文化之长，汇为一套开放而强大的机制。整合军事、建筑、教育、宫廷、政体和社会机制的通用增益，保留各文化的特色兵种、仪式与专属职位。排除额外禁令和明显负面效果。"
 cfi_integrated_group_name:0 "机制整合"
 special_doctrine_cfi_integrated_name:0 "万象归一"
 special_doctrine_cfi_integrated_desc:0 "汇集诸信条的有利机制，让知识、健康、虔诚、宝物与统治互相增益。特色仪式与专属职位保留原有信仰条件。原有的礼仪与主教义仍决定你的信仰规则。"
 cfi_enable_culture_decision:0 "启用文化机制整合"
 cfi_enable_culture_decision_desc:0 "为当前文化添加“百川汇流”，免费启用整合的文化机制。\n\n同文化的角色与伯爵领都会共享效果。你创建的新文化会延续整合；AI 创建的新文化不会继承整合。原版活动、地区、政体与 DLC 条件仍然适用。"
 cfi_enable_culture_decision_tooltip:0 "为当前文化启用整合机制"
 cfi_enable_culture_decision_confirm:0 "汇集文化机制"
 cfi_enable_culture_effect_tt:0 "当前文化获得“百川汇流”。同文化角色和伯爵领共享效果。"
 cfi_disable_culture_decision:0 "停用文化机制整合"
 cfi_disable_culture_decision_desc:0 "移除当前文化的“百川汇流”。其他文化传统保持原样。\n\n已获得的特质、建筑、宝物、法律或奖励不会被追溯撤销。"
 cfi_disable_culture_decision_tooltip:0 "移除当前文化的整合传统"
 cfi_disable_culture_decision_confirm:0 "移除整合传统"
 cfi_disable_culture_effect_tt:0 "当前文化失去“百川汇流”。已经获得的永久奖励不会回滚。"
 cfi_enable_religion_decision:0 "启用信仰机制整合"
 cfi_enable_religion_decision_desc:0 "为当前礼仪添加“万象归一”，免费启用整合的信仰机制。\n\n所有践行当前礼仪的角色都会共享效果。其他礼仪保持原样；创建新礼仪后可以再次启用。神职体系、婚姻规则与主教义仍由原有信仰决定。"
 cfi_enable_religion_decision_tooltip:0 "为当前礼仪启用整合机制"
 cfi_enable_religion_decision_confirm:0 "汇集信仰机制"
 cfi_enable_religion_effect_tt:0 "当前礼仪获得“万象归一”。同礼仪角色共享效果。"
 cfi_disable_religion_decision:0 "停用信仰机制整合"
 cfi_disable_religion_decision_desc:0 "移除当前礼仪的“万象归一”。原有信条和教义保持原样。\n\n已经产生的永久奖励不会回滚。"
 cfi_disable_religion_decision_tooltip:0 "移除当前礼仪的整合教义"
 cfi_disable_religion_decision_confirm:0 "移除整合教义"
 cfi_disable_religion_effect_tt:0 "当前礼仪失去“万象归一”。已经获得的永久奖励不会回滚。"
