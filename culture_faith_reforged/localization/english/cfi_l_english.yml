l_english:
 decision_group_type_cfi_management:0 "Culture and Faith Integration"
 tradition_cfi_integrated_name:0 "Confluence of Cultures"
 tradition_cfi_integrated_desc:0 "Combines beneficial cultural mechanics for warfare, construction, education, courts and governance. Culture-specific regiments, ceremonies, contests and offices retain their original requirements. Additional bans and clear penalties are excluded."
 cfi_integrated_group_name:0 "Integrated Mechanics"
 special_doctrine_cfi_integrated_name:0 "Concord of Faiths"
 special_doctrine_cfi_integrated_desc:0 "Combines beneficial religious mechanics for knowledge, health, piety, artifacts and governance. Distinctive rituals and offices retain their original faith requirements. Existing doctrines still govern the rite."
 cfi_enable_culture_decision:0 "Enable Integrated Cultural Mechanics"
 cfi_enable_culture_decision_desc:0 "Enable integrated mechanics for your current culture. All characters sharing that culture are affected. Existing rules and DLC requirements still apply. New rites require a fresh opt-in."
 cfi_enable_culture_decision_tooltip:0 "Enable the mechanics bundle for your culture"
 cfi_enable_culture_decision_confirm:0 "Enable integrated mechanics"
 cfi_enable_culture_effect_tt:0 "Your current culture gains the mechanics bundle."
 cfi_disable_culture_decision:0 "Disable Integrated Cultural Mechanics"
 cfi_disable_culture_decision_desc:0 "Disable integrated mechanics for your current culture. All characters sharing that culture are affected. Permanent rewards already earned are not reversed."
 cfi_disable_culture_decision_tooltip:0 "Disable the mechanics bundle for your culture"
 cfi_disable_culture_decision_confirm:0 "Disable integrated mechanics"
 cfi_disable_culture_effect_tt:0 "Your current culture loses the mechanics bundle."
 cfi_enable_religion_decision:0 "Enable Integrated Religious Mechanics"
 cfi_enable_religion_decision_desc:0 "Enable integrated mechanics for your current rite. All characters sharing that rite are affected. Existing rules and DLC requirements still apply. New rites require a fresh opt-in."
 cfi_enable_religion_decision_tooltip:0 "Enable the mechanics bundle for your rite"
 cfi_enable_religion_decision_confirm:0 "Enable integrated mechanics"
 cfi_enable_religion_effect_tt:0 "Your current rite gains the mechanics bundle."
 cfi_disable_religion_decision:0 "Disable Integrated Religious Mechanics"
 cfi_disable_religion_decision_desc:0 "Disable integrated mechanics for your current rite. All characters sharing that rite are affected. Permanent rewards already earned are not reversed."
 cfi_disable_religion_decision_tooltip:0 "Disable the mechanics bundle for your rite"
 cfi_disable_religion_decision_confirm:0 "Disable integrated mechanics"
 cfi_disable_religion_effect_tt:0 "Your current rite loses the mechanics bundle."
