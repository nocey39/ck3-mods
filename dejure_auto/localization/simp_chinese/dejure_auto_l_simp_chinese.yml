l_simp_chinese:
 dejure_auto_settings_decision:0 "领地治理设置"
 dejure_auto_settings_decision_desc:0 "配置直属封臣的普通转封或强制伯爵领归整。按月检查，可选择处理层级。"
 dejure_auto_settings_decision_tooltip:0 "打开领地治理助手"
 dejure_auto_settings_decision_confirm:0 "打开设置"
 dejure_auto_panel_title:0 "领地治理助手"
 dejure_auto_enabled_label:0 "启用每月自动整理"
 dejure_auto_enabled_help:0 "默认暂停、普通模式。启用后立即执行，以后每月检查。每轮转封、伯爵领与高阶头衔变更共用50次上限；玩家直辖分配默认关闭。设置随玩家死亡继承。"
 dejure_auto_check_now:0 "立即整理"
 dejure_auto_check_help:0 "两种模式均可启用玩家直辖分配。普通转封资格保留；强制模式按实地法理整理。每轮所有成功变更共用50次上限，具体结果见“整理明细”。"
 dejure_auto_overview:0 "状态：[GetPlayer.Custom('dejure_auto_status_text')]\n[GetPlayer.Custom('dejure_auto_feedback_short_text')]\n未完成原因及具体头衔见“执行明细”。"
 dejure_auto_status_off:0 "已暂停"
 dejure_auto_status_waiting:0 "等待下次月度检查"
 dejure_auto_status_ready:0 "已启用"
 dejure_auto_rules_heading:0 "整理规则"
 dejure_auto_rules:0 "普通转封按主头衔转移直属封臣，沿用原有资格。\n玩家直辖分配可独立启用，保留首都和高阶头衔。\n缺少合适接收者就跳过；两者共用每轮50次上限。"
 dejure_auto_mode_heading:0 "整理方式"
 dejure_auto_mode_0:0 "普通转封"
 dejure_auto_mode_1:0 "强制法理归整"
 dejure_auto_mode_0_help:0 "保持原有规则：按主头衔把整名直属封臣转交给直属的直接法理领主。不收回其他封臣的下属。 玩家直辖分配开关可独立使用，仍保留原有封臣转封规则。"
 dejure_auto_mode_1_help:0 "先纠正跨界次要高阶头衔，再整理人物隶属与跨界伯爵领。次要头衔只交给境内现有法理上级；主头衔与高阶领主的最后一个实地伯爵领保留。不创建头衔或人物，不改法理与继承法。"
 dejure_auto_tier_heading:0 "处理的直属封臣层级 · 可多选"
 dejure_auto_tier_help:0 "普通模式筛选被转封人的等级。强制模式选定每轮开始时的直属势力，包含其间接封臣及领地；本轮保留原范围，下轮按新的直属结构筛选。接收者不受限制。切换选项不立即执行。"
 dejure_auto_force_rules:0 "先次要高阶头衔，再人物层级与跨界伯爵领；保留合理持地。\n缺失层级留空，无境内上级则直属玩家。\n玩家直辖默认保留；分配开关只转出非首都伯爵领。"
 dejure_auto_tier_county:0 "伯爵"
 dejure_auto_tier_duchy:0 "公爵"
 dejure_auto_tier_kingdom:0 "国王"
 dejure_auto_tier_empire:0 "皇帝"
 dejure_auto_result_help:0 "详见「整理明细」。\n无合适接收者 [GetPlayer.MakeScope.Var('dejure_auto_unassigned').GetValue|0] 领 · 支系冲突 [GetPlayer.MakeScope.Var('dejure_auto_conflicts').GetValue|0] 领 · 末领保护 [GetPlayer.MakeScope.Var('dejure_auto_last_county_kept').GetValue|0] 领\n类别可能重叠或受保护；玩家直辖转出 [GetPlayer.MakeScope.Var('dejure_auto_last_player_counties').GetValue|0] 领。"
 dejure_auto_report_changed_titles:0 "已转移的头衔"
 dejure_auto_report_changed_people:0 "已调整隶属的人物"
 dejure_auto_report_missing:0 "缺少接收者／法理上级由你持有／租借限制"
 dejure_auto_report_conflict:0 "主头衔或上下层支系冲突"
 dejure_auto_report_last_county:0 "保留高阶领主的最后一个实地伯爵领"
 dejure_auto_report_protected:0 "安全限制记录（不等同当前保留名单）"
 dejure_auto_report_pending:0 "达到本轮上限，下次继续"
 dejure_auto_report_failed:0 "仍未完成，需游戏内核查"
 dejure_auto_report_button:0 "执行明细"
 dejure_auto_report_title:0 "上次整理明细"
 dejure_auto_report_back:0 "返回设置"
 dejure_auto_report_hint:0 "上次执行的历史记录，下次有效检查或继承时刷新。当前保护名单请回设置查看；下方头衔链接显示当前状态，不是历史持有人快照。"
 dejure_auto_report_current_holder:0 "当前持有人：[Title.GetHolder.GetUIName]"
 dejure_auto_report_current_liege:0 "当前领主：[Character.GetLiege.GetUIName]"
 dejure_auto_distribute_domain:0 "分配玩家直辖伯爵领"
 dejure_auto_distribute_domain_help:0 "默认关闭，两种模式都可用。把亲持的非首都实地伯爵领交给最近的境内 AI 法理领主；无接收者或你持有上级头衔时保留。始终保留首都与主头衔，不转出高阶头衔。与当前模式共用每轮 50 次上限。"
 dejure_auto_create_heading:0 "自动创建头衔 · 低于玩家最高等级"
 dejure_auto_grant_heading:0 "自动分封头衔 · 分权制衡"
 dejure_auto_people_heading:0 "无地人选 · 按下列顺序回退"
 dejure_auto_create_duchy:0 "创建公国"
 dejure_auto_create_kingdom:0 "创建王国"
 dejure_auto_create_empire:0 "创建帝国"
 dejure_auto_grant_county:0 "伯爵领"
 dejure_auto_grant_duchy:0 "公国"
 dejure_auto_grant_kingdom:0 "王国"
 dejure_auto_grant_empire:0 "帝国"
 dejure_auto_people_direct:0 "直系亲属（关闭则在全部档位排除）"
 dejure_auto_people_house:0 "家族"
 dejure_auto_people_dynasty:0 "宗族"
 dejure_auto_people_noble:0 "其他贵族"
 dejure_auto_people_lowborn:0 "平民"
 dejure_auto_people_culture:0 "同文化"
 dejure_auto_people_faith:0 "同信仰"
 dejure_auto_unify_heading:0 "封臣归化"
 dejure_auto_unify_faith:0 "统一信仰"
 dejure_auto_unify_culture:0 "统一文化"
 dejure_auto_unify_government:0 "统一政体"
 dejure_auto_unify_government_help:0 "强制全境符合条件的伯爵及以上 AI 封臣改用你的政体。跳过神权制、教会制、受保护的封臣和其他玩家麾下的封臣。默认关闭。每月自动整理或点击「立即整理」时生效。"
 dejure_auto_unify_help:0 "按勾选项强制全境符合条件的伯爵及以上 AI 封臣采用你的信仰和礼仪，或你的文化。跳过受保护的封臣及其他玩家的封臣分支。改信还会跳过神权制、教会制、宗教领袖和享有宗教保护的封臣。首府和近亲可按原版规则一同改信。统一文化只改封臣本人。两项默认关闭。"
 dejure_auto_unify_summary:0 "上次归化：信仰 [GetPlayer.MakeScope.Var('dejure_auto_unify_force_faith_done').GetValue|0] · 文化 [GetPlayer.MakeScope.Var('dejure_auto_unify_force_culture_done').GetValue|0] · 政体 [GetPlayer.MakeScope.Var('dejure_auto_unify_government_done').GetValue|0]"
 dejure_auto_title_cost_heading:0 "头衔创建费用"
 dejure_auto_title_fee:0 "费用比例（0%免费）"
 dejure_auto_title_reserve:0 "费用支付后保留"
 dejure_auto_create_help:0 "创建与分封分别勾选，默认关闭；随顶部总开关每月检查，也可立即整理。只创建低于玩家最高等级、具有实地伯爵领的可创建头衔。不篡夺、不创建同级或更高头衔。每轮最多创建5个。"
 dejure_auto_grant_help:0 "按分权制衡分封。有可分配的当地直辖伯爵领时，给新人一处伯爵领加高阶头衔（不要求勾选单独分封）。否则晋升当地子领地较少、低于目标等级的领主。无合适人选就暂缓。"
 dejure_auto_people_help:0 "无地成年人按直系亲属→家族→宗族→其他贵族→平民逐档寻找，关闭的档位跳过。搜索你与境内 AI 封臣的宫廷及你的宾客。先严格筛文化与信仰，再比人选：贤能政体先贤能等级再管理，其他按管理。"
 dejure_auto_direct_help:0 "只考虑无地成年直系血亲：父母、祖辈、子女和后代，不含兄弟姐妹。默认关闭；关闭后，即使同时勾选家族、宗族或贵族，也不会分封这些直系亲属。配偶始终排除。"
 dejure_auto_title_cost_help:0 "所有创建等级共用一个比例。基础费用：公国 150、王国 300、帝国 600。按政体规则从国库或私库金币支付，0% 免费。不叠加角色、文化或建筑减免。扣费在创建确认后，分封不另收费。"
 dejure_auto_title_result_help:0 "统计上次检查的创建、分封组合与创建支出。暂缓＝无合适人选；未确认＝需核查事务。创建与分封每轮合计上限 20 次，高阶头衔连同一处伯爵领计两次。"
 dejure_auto_titles_summary:0 "上次：创建 [GetPlayer.MakeScope.Var('dejure_auto_title_created').GetValue|0] · 分封 [GetPlayer.MakeScope.Var('dejure_auto_title_granted').GetValue|0]\n创建支出：[GetPlayer.MakeScope.Var('dejure_auto_title_paid').GetValue|0]\n暂缓：[GetPlayer.MakeScope.Var('dejure_auto_title_waiting').GetValue|0] · 未确认：[GetPlayer.MakeScope.Var('dejure_auto_title_failed').GetValue|0]"
 dejure_auto_title_created_heading:0 "上次确认创建的头衔"
 dejure_auto_title_granted_heading:0 "上次确认授予的头衔（含连带伯爵领）"
 dejure_auto_title_waiting_heading:0 "分封暂缓：没有合适人选"
 dejure_auto_title_failed_heading:0 "分封未确认：需核查"


