l_simp_chinese:
 dau_market_settings_label:0 "经济规划（直属地产）"
 dau_market_settings_help:0 "按预计税收、市场供需和地产承载能力安排直属地产的工程，在建项目预留原料。沿用你的建设范围、建设偏好、金币与国库储备，以及商人委托设置。关闭后回到按原建设偏好安排工程。"
 dau_market_commission_label:0 "自动委托商人补给"
 dau_market_commission_help:0 "市场有实际短缺时，寻找有资格并愿意接单的商人属国。按原版威望费用和你的储备线付款，委托成功后才扣费。"
 dau_market_commission_started_text:0 "已委托商人，待实际到货后再评估扩张。"
 dau_market_status_display:0 "经济规划 · [GetPlayer.Custom('dau_market_status_text')]"
 dau_market_disabled_text:0 "已关闭。"
 dau_market_relief_wait_text:0 "已安排补产，仍有项目等待供给。"
 dau_market_wait_text:0 "部分扩张暂缓，等待供给、控制力或民众好感改善。"
 dau_market_holding_wait_text:0 "新地产暂缓，等待本市场粮食短缺缓解或在建扩张完工。"
 dau_land_status_market_wait:0 "经济规划暂缓了部分工程。"
 dau_econ_no_return_text:0 "可负担的候选中有低回报工程，规划保留预算。"
 dau_market_relief_text:0 "已优先安排能缓解市场短缺的项目。"
 dau_market_committed_text:0 "已为开工项目预留预计原料。"
 dau_market_ready_text:0 "将按预计回报和供需安排直属地产工程。"
 dau_econ_observation_display:0 "[GetPlayer.Custom('dau_econ_observation_text')]"
 dau_econ_observation_empty:0 "月净额将在首次领地检查时记录。"
 dau_econ_observation_gold:0 "@gold_icon! 金币月净额 [GetPlayer.MakeScope.Var('dau_econ_gold_observed').GetValue|1+=]（较初次 [GetPlayer.MakeScope.Var('dau_econ_gold_observed_change').GetValue|1+=]）"
 dau_econ_observation_both:0 "$dau_econ_observation_gold$\n@treasury_icon! 国库月净额 [GetPlayer.MakeScope.Var('dau_econ_treasury_observed').GetValue|1+=]（较初次 [GetPlayer.MakeScope.Var('dau_econ_treasury_observed_change').GetValue|1+=]）"
 dau_econ_observation_help:0 "记录本角色的实际月净额，包含所有收入和支出。初次记录作为比较基准，之后在领地检查时每隔至少 30 天更新。工程回报估算和月净额是两项独立数据。"
