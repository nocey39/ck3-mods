l_simp_chinese:
 court_auto_settings_decision:0 "内阁与宫廷助手设置"
 court_auto_settings_decision_desc:0 "管理内阁与宫廷职位的自动补位。保留现任，空缺时按策略择优任命；设置在玩家角色死亡后交给接着游玩的角色。"
 court_auto_settings_decision_tooltip:0 "打开独立设置窗口"
 court_auto_settings_decision_confirm:0 "打开设置"
 court_auto_panel_title:0 "内阁与宫廷助手"
 court_auto_enabled_label:0 "启用自动化"
 court_auto_enabled_help:0 "默认暂停。开启后会立即补位，但不会立即派内阁任务；任务在点“立即检查”或每月检查时续派。之后人事按所选间隔评估。关闭后保留现任和已派遣任务。"
 court_auto_check_now:0 "立即检查"
 court_auto_check_help:0 "立即评估已启用模块：补空缺，并对允许换人的模块择优换人；随后重新开始人事间隔计时。也检查任务续派，不解除手动改派保护。"
 court_auto_status_display:0 "当前状态：[GetPlayer.Custom('court_auto_status_text')]"
 court_auto_last_display:0 "最近一次补位：内阁 [GetPlayer.MakeScope.Var('court_auto_last_council').GetValue|0] 人 · 宫廷职位 [GetPlayer.MakeScope.Var('court_auto_last_court').GetValue|0] 人"
 court_auto_status_off:0 "已暂停"
 court_auto_status_modules_off:0 "所有项目均已关闭"
 court_auto_status_waiting:0 "本轮检查完成，等待下次检查"
 court_auto_status_ready:0 "已启用，等待检查"
 court_auto_council_label:0 "内阁任命与替换"
 court_auto_council_help:0 "启用内阁人事评估。仅补空缺或允许择优换人，由下方内阁模式决定。候选人使用原版任职资格。"
 court_auto_council_note:0 "两种模式都使用所选策略：先填补空位；允许换人时再比较现任，同分保留。"
 court_auto_strategy_1:0 "强势封臣优先"
 court_auto_strategy_0:0 "属性优先"
 court_auto_strategy_1_help:0 "优先从合格且尚未在你的内阁任职的强势封臣中选对应属性最高者；无人可用时再考虑其他候选人。"
 court_auto_strategy_0_help:0 "在合格且尚未在你的内阁任职的人选中，只比较该席位对应的属性。"
 court_auto_council_scope_note:0 "管理常规内阁及可自行任命的司祭，支持天朝新增部职。配偶与其他特殊议事席位沿用原版。"
 court_auto_court_label:0 "宫廷任命与替换"
 court_auto_court_help:0 "启用宫廷人事评估，覆盖当前可用职位及多人名额。仅补空缺或允许换人，由下方宫廷模式决定；沿用原版资格、兼任限制与原始适性评分。"
 court_auto_court_note:0 "按原版原始适性分数择优。默认保留现任；允许换人时同分仍保留。医生与旅队主管优先检查，兼任沿用原版。"
 court_auto_interval_label:0 "检查间隔"
 court_auto_interval_1:0 "每月"
 court_auto_interval_6:0 "每半年"
 court_auto_interval_12:0 "每年"
 court_auto_interval_help:0 "启用模块时立即检查，之后按间隔补位。改变间隔会重新计时；继承设置后次日额外检查一次。"
 court_auto_rules_label:0 "补位规则"
 court_auto_rules_note:0 "开关、模式、策略及间隔随玩家死亡继承；主动切换到仍存活的角色不复制。只用现有合法候选人，不招募。替换可能产生关系、费用和任务进度影响；职位薪酬及原版逐职位自动配置继续生效。"
 court_auto_ui_overview:0 "当前状态：[GetPlayer.Custom('court_auto_status_text')]\n最近：内阁 [GetPlayer.MakeScope.Var('court_auto_last_council').GetValue|0] · 宫廷 [GetPlayer.MakeScope.Var('court_auto_last_court').GetValue|0] · 派遣 [GetPlayer.MakeScope.Var('court_auto_last_tasks').GetValue|0]"
 court_auto_ui_appointments:0 "人事设置"
 court_auto_ui_modules:0 "启用模块"
 court_auto_ui_council:0 "内阁"
 court_auto_ui_court:0 "宫廷职位"
 court_auto_ui_strategy:0 "内阁策略"
 court_auto_ui_schedule:0 "检查安排"
 court_auto_ui_interval_6:0 "每半年"
 court_auto_ui_monthly_note:0 "每月自动检查 · 可随时立即检查"
 court_auto_ui_monthly_help:0 "启用后立即检查，之后固定每月补位。原半年、年度设置在打开设置或后续调度时转为每月，保留开关和内阁策略；旧定时任务随转换失效。"
 court_auto_ui_rules_open:0 "▾ 规则说明"
 court_auto_ui_rules_closed:0 "▸ 规则说明"
 court_auto_ui_rules_help:0 "点击展开或收起详细说明。只改变界面显示，不影响自动补位和已保存的设置。"
 court_auto_ui_summary:0 "默认保留现任 · 择优换人须启用 · 原版薪酬"
 court_auto_tasks_heading:0 "内阁任务续派"
 court_auto_tasks_help:0 "续派范围：直辖／当前法理公国／当前法理王国；未高亮即不续派。只在你手动指派后生效，完成后在范围内找下一个，先直辖后封臣；无目标即停。不改原版资格与速度。"
 court_auto_task_scope_1:0 "直辖"
 court_auto_task_scope_2:0 "公国"
 court_auto_task_scope_3:0 "王国"
 court_auto_task_status_off:0 "未选范围（不续派）"
 court_auto_task_status_master_off:0 "总开关已暂停"
 court_auto_task_status_no_worker:0 "等待对应内阁成员"
 court_auto_task_status_manual:0 "手动改派后暂停"
 court_auto_task_status_exhausted:0 "当前范围内已无目标；点“立即检查”重试或改范围"
 court_auto_task_status_working:0 "执行中，保留当前任务"
 court_auto_task_status_waiting:0 "等待下次检查或合法目标"
 court_auto_task_conversion_label:0 "传教"
 court_auto_task_conversion_help:0 "状态：[GetPlayer.Custom('court_auto_task_conversion_status')]\n$court_auto_tasks_help$\n直辖＝只在你本人持有的伯爵领里找下一个目标；公国／王国＝以当前目标所在的法理公国／王国为界。手动改派优先；关闭只停续派，不撤回当前任务。"
 court_auto_task_culture_label:0 "推广文化"
 court_auto_task_culture_help:0 "状态：[GetPlayer.Custom('court_auto_task_culture_status')]\n$court_auto_tasks_help$\n直辖＝只在你本人持有的伯爵领里找下一个目标；公国／王国＝以当前目标所在的法理公国／王国为界。手动改派优先；关闭只停续派，不撤回当前任务。"
 court_auto_task_control_label:0 "提高控制力"
 court_auto_task_control_help:0 "状态：[GetPlayer.Custom('court_auto_task_control_status')]\n$court_auto_tasks_help$\n直辖＝只在你本人持有的伯爵领里找下一个目标；公国／王国＝以当前目标所在的法理公国／王国为界。手动改派优先；关闭只停续派，不撤回当前任务。"
 court_auto_memory_label:0 "记住内阁常态任务"
 court_auto_memory_help:0 "总开关开启时，按人事评估间隔或点击“立即检查”观察内阁任务。临时差事和续派结束、换人或换代后，会恢复记住的常态。两次检查间未看到的切换可能无法记住。"
 court_auto_review_council:0 "内阁模式"
 court_auto_review_court:0 "宫廷模式"
 court_auto_review_mode_0:0 "仅补空缺"
 court_auto_review_mode_1:0 "允许择优换人"
 court_auto_review_council_help:0 "默认只补空缺。允许换人时先补空缺，再按所选策略比较现任与合法人选；同分保留，不做连锁调岗。受任职保障或宗教限制者跳过。换人可能中断任务进度。"
 court_auto_review_court_help:0 "默认只补空缺。允许换人时按原版适性分数择优替换，同分保留；多人职位先换最低分者。用原生替换效果，可能产生撤职费用与关系影响，付不起就跳过。"
 court_auto_review_frequency:0 "人事评估间隔"
 court_auto_review_interval_help:0 "内阁与宫廷共用此间隔。改间隔会重新计时；总开关或模块开启、死亡继承后的次日、立即检查会额外评估一次。任务范围按钮只检查任务，任务续派固定每月。"
 court_auto_review_tasks_note:0 "影响人事评估与常态记忆 · 内阁任务仍每月续派"

