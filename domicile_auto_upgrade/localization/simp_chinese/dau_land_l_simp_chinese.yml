l_simp_chinese:
 dau_land_settings_decision:0 "领地自动升级设置"
 dau_land_settings_decision_desc:0 "打开领地自动升级设置面板：启用/关闭、管理范围、检查间隔、每批数量、费用比例。只升级已有建筑，不新建地产、区划或建筑。"
 dau_land_settings_decision_tooltip:0 "打开领地自动升级设置"
 dau_land_settings_decision_confirm:0 "打开设置"
 dau_land_panel_title:0 "领地自动升级"
 dau_land_enabled_label:0 "启用领地自动建设"
 dau_land_enabled_help:0 "开启后立即检查，之后按设定间隔执行。启用经济规划时，直属地产的开发、新建和升级按预计回报与供需安排。"
 dau_land_status_display:0 "上次检查：[GetPlayer.Custom('dau_land_status_text')]"
 dau_land_status_off:0 "已暂停"
 dau_land_status_ready:0 "等待检查"
 dau_land_status_done:0 "封建化 [GetPlayer.MakeScope.Var('dau_land_last_feudalized').GetValue|0] · 升级 [GetPlayer.MakeScope.ScriptValue('dau_land_last_upgraded_count')|0] · 空槽 [GetPlayer.MakeScope.Var('dau_land_last_built').GetValue|0] · 开工 [GetPlayer.MakeScope.Var('dau_land_last_created').GetValue|0] · 替换 [GetPlayer.MakeScope.Var('dau_land_last_replaced').GetValue|0]"
 dau_land_status_none:0 "没有符合条件的处理项目"
 dau_land_status_no_scope:0 "未选择管理范围"
 dau_land_status_budget:0 "资源不足或需要保留储备"
 dau_land_status_failed:0 "处理未成功，未扣费"
 dau_land_reserve_heading:0 "玩家资源储备 · 付款后保留"
 dau_land_reserve_help:0 "全部由你付款，不用封臣资源。政体允许国库替代金币时，领地费用走国库并检查国库储备，不足也不回退私人金币。两套建设同时开启时取较高储备。虔诚与影响力只查余额。"
 dau_land_scope_title:0 "管理范围 · 可多选"
 dau_land_group_1:0 "本人直属"
 dau_land_group_2:0 "伯爵领附属"
 dau_land_group_3:0 "其余封臣"
 dau_land_scope_help:0 "直属地产：本人持有的地产。伯爵领附属：本人直辖伯爵领中由他人持有的地产。其他封臣：其余直属或间接封臣地产。可分别勾选，默认按这个顺序优先建设；空男爵领仅随对应伯爵领的本人或其他封臣范围处理。法理分区只决定建设顺序，不限制到本人持有的法理头衔。"
 dau_land_category_title:0 "空槽建造 · 按启用顺序优先"
 dau_land_category_help:0 "空槽采用每处地产的建设倾向与综合基础收益排名；已有升级比较本级增量。请使用建设倾向控件。"
 dau_land_previous:0 "‹"
 dau_land_next:0 "›"
 dau_land_feudalize_label:0 "自动封建化地产"
 dau_land_feudalize_help:0 "默认关闭。按所选范围优先把符合原版资格的部落、游牧、牧民地产转为城堡，曼陀罗封臣转为寺庙城塞。遵守原版政体与施工条件，转换立即完成。与普通建设共用费用比例、储备与批次。"
 dau_land_new_holding_help:0 "默认关闭。开启后，助手会评估符合原版资格的地产类型并自动选型。启用经济规划时，新地产与其他直属工程按供需和预计回报竞争预算，时机不合适时会暂缓开发。"
 dau_land_batch_title:0 "每次检查最多处理地产数"
 dau_land_batch_5:0 "5 处"
 dau_land_batch_10:0 "10 处"
 dau_land_batch_20:0 "20 处"
 dau_land_batch_help:0 "每次最多处理所选数量的不同男爵领，地产封建化、已有升级、普通空槽建造和新建地产共用上限。每处每天至多自动处理一次，每次付款后重新检查余额。"
 dau_land_interval_1:0 "每月"
 dau_land_interval_2:0 "每半年"
 dau_land_interval_4:0 "每年"
 dau_land_check_help:0 "立即检查本批工程。地产开发和其他建设共用批次、费用比例及资金储备。"
 dau_land_rules_summary:0 "建筑即时完成 · 新地产正常工期 · 玩家付款"
 dau_land_rules_note:0 "工程遵守持有者的原版资格。空地产须授权开发，助手自动选型。公国建筑由玩家建造首级，助手可升级已建建筑。设置随角色死亡转交继任者。"
 dau_land_price_note:0 "封建化、普通建筑与新建地产共用本页比例与储备。不读额外加成，金币与国库存按政体规则。预算与扣费使用同一价格，扣费在确认转换或完工后。新地产取消不退款。"
 dau_land_value_gold:0 "[GetPlayer.MakeScope.Var('dau_land_gold_reserve').GetValue|0]"
 dau_land_value_treasury:0 "[GetPlayer.MakeScope.Var('dau_land_treasury_reserve').GetValue|0]"
 dau_land_value_prestige:0 "[GetPlayer.MakeScope.Var('dau_land_prestige_reserve').GetValue|0]"
