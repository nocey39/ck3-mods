 dau_land_cost_value:0 "[GetPlayer.MakeScope.Var('dau_land_cost_percent').GetValue|0]%"
 dau_land_replace_label:0 "允许按策略替换已有建筑（已停用）"
 dau_land_replace_help:0 "已停用。旧存档保留此设置，但不会执行替换建设。"
 dau_land_status_replace_failed:0 "替换功能已停用，未收取替换费用。"
 dau_land_ui_costs:0 "费用设置"
 dau_land_reserve_summary:0 "@gold_icon![GetPlayer.MakeScope.Var('dau_land_gold_reserve').GetValue|0]   @treasury_icon![GetPlayer.MakeScope.Var('dau_land_treasury_reserve').GetValue|0]   @prestige_icon![GetPlayer.MakeScope.Var('dau_land_prestige_reserve').GetValue|0]"
 dau_land_plan_label:0 "空槽建设倾向"
 dau_land_plan_value:0 "[GetPlayer.Custom('dau_land_plan_text')]"
 dau_land_plan_help:0 "每处地产单独统计已有普通建筑。偏经济约 2 经济配 1 军事，偏军事相反，均衡约 1:1；缺一类时另一类可补位，纯经济与纯军事不跨类。主建筑、特殊与无法识别的建筑不计入。"
 dau_land_plan_defense_label:0 "防御建筑优先"
 dau_land_plan_defense_help:0 "可建且可负担的防御建筑优先，不计入经济与军事组成；可在空槽倾向关闭时单独启用。"
 dau_land_plan_0:0 "关闭"
 dau_land_plan_1:0 "纯经济"
 dau_land_plan_2:0 "偏经济"
 dau_land_plan_3:0 "均衡"
 dau_land_plan_4:0 "偏军事"
 dau_land_plan_5:0 "纯军事"
 dau_land_region_title:0 "法理范围限制"
 dau_land_region_enabled_label:0 "仅建设自持头衔的法理范围"
 dau_land_region_duchy:0 "公国"
 dau_land_region_kingdom:0 "王国"
 dau_land_region_empire:0 "帝国"
 dau_land_region_help:0 "默认关闭。启用后，按勾选等级汇总本人持有头衔的法理范围，重叠地区只处理一次；只含实际境内领地，再应用原有管理范围。未勾等级、没有对应头衔或没有境内地区时不建设。范围外的直辖地产也跳过。每轮重新收集，范围名单不跨轮保留。"
 dau_land_region_empty_label:0 "法理范围内没有可管理地区，请检查头衔等级与实际领地"
 dau_ui_interval_7:0 "每周"
 dau_land_interval_7:0 "每周"
 dau_land_schedule_help:0 "每周按7个游戏日检查，每月使用月度延时；每半年、每年分别间隔2、4次角色季度脉冲。更改间隔重新计时，保留每轮5／10／20处上限及每处每天一次限制。"
 dau_ui_interval_3:0 "每3天"
 dau_land_interval_3:0 "每3天"
 dau_land_three_day_schedule_help:0 "每3天、每7天或每月检查。旧版每半年、每年的设置自动转为每月。更改间隔重新计时，每轮5／10／20次上限及每处每天一次限制保持。"
 dau_land_zone_title:0 "自动分区推进"
 dau_land_zone_order:0 "直属优先 → 伯爵领附属 → 其他封臣"
 dau_land_zone_progress:0 "[GetPlayer.Custom('dau_land_zone_progress_text')]"
 dau_land_zone_ready_text:0 "将优先检查直属地产，再按法理区域集中建设"
 dau_land_zone_focus_text:0 "封臣区域：[GetPlayer.MakeScope.Var('dau_land_zone_focus').Title.GetName]"
 dau_land_zone_idle_text:0 "当前暂无可做项目，自动延后复查；立即检查可跳过等待"
 dau_land_zone_help:0 "默认先建设本人直属，再建设直辖伯爵领内的附属地产；其他封臣按法理王国集中推进，王国内逐公国处理。不要求持有或创建法理头衔；缺少上级时使用较小分区。今天已处理过的地区保留到下轮继续，当前无资格或无预算的地区暂时跳过；全部暂无项目时约30日后复查。每轮共享建设上限，拆旧仍受原开关控制。"
 dau_land_zone_group_1_label:0 "直属地产"
 dau_land_zone_group_2_label:0 "伯爵领附属"
 dau_land_zone_group_3_label:0 "其他封臣"
