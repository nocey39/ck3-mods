 teq_preview_share: "[Divide_CFixedPoint(TreasuryBudgetChangeWindow.GetNewBudgetTotal( GuiLawGroup.Self ), Max_CFixedPoint(TreasuryBudgetChangeWindow.GetNewBudgetTotalSum, '(CFixedPoint)0.001'))|%0]"
 teq_preview_law_name: "[TreasuryBudgetChangeWindow.AccessSelectedLaw( GuiLawGroup.AccessSelf ).GetLaw.GetShortName]"
 teq_preview_trend: "[Add_CFixedPoint(Subtract_CFixedPoint(Select_CFixedPoint(GetScriptedGui('teq_budget_shared_ui').IsShown(GuiScope.SetRoot(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope).End), TreasuryBudgetChangeWindow.GetCurrentBudgetTotal(GuiLawGroup.Self), TreasuryBudgetChangeWindow.GetNewBudgetTotal(GuiLawGroup.Self)), TreasuryBudgetChangeWindow.GetNewBudgetTotal(GuiLawGroup.Self)), TreasuryBudgetChangeWindow.GetBudgetTotalDiff(GuiLawGroup.Self))|2+=]"
 teq_preview_base_gold: "[gold_i][Select_CFixedPoint(GetScriptedGui('teq_budget_shared_ui').IsShown(GuiScope.SetRoot(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope).End), TreasuryBudgetChangeWindow.GetCurrentBudgetBaseRate(GuiLawGroup.Self), TreasuryBudgetChangeWindow.GetNewBudgetBaseRate(GuiLawGroup.Self))|2]"
 teq_preview_base_treasury: "[treasury_i][Select_CFixedPoint(GetScriptedGui('teq_budget_shared_ui').IsShown(GuiScope.SetRoot(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope).End), TreasuryBudgetChangeWindow.GetCurrentBudgetBaseRate(GuiLawGroup.Self), TreasuryBudgetChangeWindow.GetNewBudgetBaseRate(GuiLawGroup.Self))|2]"
 teq_current_envelope: "每月总预算（含俸禄）：[treasury_i][TreasuryBudgetChangeWindow.GetTitle.MakeScope.Var('teq_total_budget').GetValue|1]"
 teq_retained_target: "中央月度结余目标：[treasury_i][TreasuryBudgetChangeWindow.GetTitle.MakeScope.Var('teq_retained_flow').GetValue|1]（扣开支后净入库的[TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_retained_income_fraction')|%0]）"
 teq_reserve_flow: "国库未分配比例"
 teq_budget_explanation: "所有箭头：左键调整1个百分点，右键调整5个百分点，即时生效。发展与军事按共同资金池直接互调；俸禄调整的是待遇标准，并非预算份额，总俸禄仍不超过总预算10%。国库未分配比例与私库收入比例分别设置。"
 teq_native_surplus_diff: "[TreasuryBudgetChangeWindow.GetBudgetSurplusDiff()|1+=]"
 teq_empty: " "
 teq_apply_allocation: "执行预算政令"
 teq_allocation_effects: "俸禄保留自动增长，可手动微调待遇；100%为1倍基础工资，范围0%至200%，总额不超过预算10%。\n\n发展与军事直接互调共同资金池的份额。\n\n箭头左键调整1个百分点，右键调整5个百分点，立即生效。\n\n执行预算政令另保留原版消耗与政治效果。"
 teq_vanilla_effects: "[TreasuryBudgetChangeWindow.GetBudgetEnactEffectDescription]"

 teq_reserve_adjust_help: "扣除军费、宫廷职位等中央固定花销后的净入库国库中，保留在中央、暂不拨入封臣预算的比例；默认5%，范围0%至100%。左键调整1个百分点，右键调整5个百分点；免费即时生效并随存档保存。"

 teq_private_share: "私库收入比例"
 teq_private_reset: "恢复5%"
 teq_private_adjust_help: "直辖税、封臣税和贡金等原生可分流收入，默认5%进入私库、95%进入国库。庄园、工资等其他渠道沿用原版。左键调整1个百分点，右键调整5个百分点，范围0%至100%；免费立即生效并随存档保存，现有国库余额不变。公共预算同步校准。特殊修正阻止分流时会暂时保留原生效分流，稍后重试。\n\n[SelectLocalization(EqualTo_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_private_split_status_value'), '(CFixedPoint)1'), 'teq_private_status_applied', 'teq_private_status_pending')]"
 teq_private_status_applied: "当前分流已生效（实际私库比例：[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_private_applied_fraction_value'), '(CFixedPoint)0.0005')|%1]）。"
 teq_private_status_pending: "尚未验证：保留原分流，下月重试。"

 teq_salary_tier: "[SelectLocalization(EqualTo_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_salary_tier_value'), '(CFixedPoint)0'), 'teq_salary_poor', SelectLocalization(EqualTo_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_salary_tier_value'), '(CFixedPoint)1'), 'teq_salary_normal', 'teq_salary_rich'))]"

 teq_salary_poor: "困难"

 teq_salary_normal: "正常"

 teq_salary_rich: "富裕"

 teq_fixed_payroll: "统一俸禄结算"

 teq_live_budget_help: "此处显示当前实付预算，调整比例即重算拨款。俸禄按官职、品级和待遇标准计算，仍受总预算10%上限约束。发展和军事的实际拨款请看「总额」，展开可查看个人实收。"
 teq_current_budget_breakdown_title: "当前实付明细"
 teq_current_budget_breakdown_total: "合计：[treasury_i] [TreasuryBudgetChangeWindow.GetCurrentBudgetTotal(GuiLawGroup.Self)|1]"
 teq_current_budget_breakdown_note: "当前实付明细，与左侧金额使用同一结算结果。没有实际支出或受益方时，明细为空。"
 teq_all_current_treasury_expenses: "全部国库支出（悬停查看）"
 teq_salary_coefficient: "[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_control_salary_fraction'), '(CFixedPoint)0.0005')|%1]"
 teq_salary_curve_help: "俸禄待遇：100%为1倍基础工资，可在自动待遇上手动微调，范围0%至200%；点击待遇数值可恢复自动。左键调整1个百分点，右键调整5个百分点，即时生效。自动基准仍随财政按月平滑增长，同月重复操作不会加速增长；总俸禄仍不超过总预算10%，财政不足时折发。实际支付基准见“基础值”。"

 teq_control_allocation_header: "分配／待遇"

 teq_control_salary_label: "俸禄待遇"

 teq_control_development_display: "[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_control_development_share'), '(CFixedPoint)0.00005')|%0]"

 teq_control_military_display: "[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_control_military_share'), '(CFixedPoint)0.00005')|%0]"

 teq_control_cardinal_display: "[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_control_cardinal_share'), '(CFixedPoint)0.0005')|%1]"



 teq_control_public_help: "发展与军事按共同资金池内的设定份额拨款，两项合计100%。左键调整1个百分点，右键调整5个百分点，立即生效。设为0%或没有合格受益方时，该项实付为0。未拨出的资金留在中央国库。实际拨款请看「总额」。"

 teq_control_cardinal_help: "保留原生枢机预算在公共预算中的份额。发展和军事的100%是两者共同资金池的内部比例，不包含此项。"

 teq_control_political_help: "比例调整已即时生效。此按钮单独执行原版预算政令，保留原版资源消耗与政治效果。\n\n[TreasuryBudgetChangeWindow.GetCanEnactBudgetDescription]"

 teq_control_window_title: "国库预算分配（即时生效）"

 teq_control_salary_reset_help: "恢复自动待遇：点击此数值清除手动微调，重新采用当前自动工资基准。总俸禄仍受预算10%上限约束。"
