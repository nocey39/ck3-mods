l_english:
 ama_panel_title:0 "Army Development Assistant"
 ama_personal_row_label:0 "Personal"
 ama_personal_row_help:0 "Ordinary personal and adventurer-owned regiments. This row's creation and expansion switches operate independently of title troops."
 ama_title_row_label:0 "Title"
 ama_create_label:0 "Create"
 ama_create_help:0 "Create personal regiments by ratio, independently of title creation and expansion. Automatic disbanding first removes units outside this pool's categories or strategy. All modes share 20 operations per month with next-day confirmation."
 ama_expand_label:0 "Expand"
 ama_expand_help:0 "Expands selected personal categories. Reads each unit's size and ceiling first, then charges and adds one level; full, oversized or unreadable units are skipped, as are raised or fighting troops. Zero shares leaves the category unmanaged; weights never cap existing size."
 ama_titles_label:0 "Personally held title troops"
 ama_titles_help:0 "Title creation stays paused. Expansion reads each regiment's latest native ceiling and only manages selected categories whose owning and controlling titles are both yours. Borrowed troops are excluded and oversized units kept. Shares the monthly 20-operation budget."
 ama_title_create_label:0 "Create"
 ama_title_create_help:0 "Each title estimates its own cap from adapted native rules and fills by ratio, recomputed before every request; personal slots and stale display snapshots are never used. Unresolved rank or house sources skip that title. All sources share budgets and 20 monthly operations."
 ama_title_expand_label:0 "Expand"
 ama_title_expand_help:0 "Expands selected personally held title troops independently. The GUI host reads the unit's latest ceiling; the response rechecks ownership and budget, then adds one level. Full or oversized units are not shrunk, and failed reads charge nothing."
 ama_create_disabled_hint:0 "Creation is disabled. Selected categories may expand; zero disables expansion. In creation-enabled pools, automatic disbanding also removes zero-weight units."
 ama_check_now:0 "Check now"
 ama_check_help:0 "A new cycle starts monthly, with idle checks every 7 days. Successful operations continue daily, up to 20 per month. Expansion uses the assistant payment settings and a fresh native regiment size cap."
 ama_status_display:0 "Status: [GetPlayer.Custom('ama_status')]"
 ama_status_help:0 "Handles ordinary personal and adventurer regiments plus, when enabled, personally held title troops. Special, event and hired troops are excluded. Do not manually recruit or disband the same type while a confirmation is pending.\n[GetPlayer.Custom('ama_receipt')]"
 ama_targets_label:0 "Managed categories and recruitment ratios"
 ama_targets_help:0 "Positive weights set recruitment ratios and allow expansion. Zero stops creation/expansion of that category; with automatic disbanding enabled, its existing units are removed too."
 ama_target_step:0 "Adjust by one weight. Zero stops creation and expansion; automatic disbanding also removes existing units of that category."
 ama_category_column:0 "Troop category"
 ama_ratio_column:0 "Manage / create shares"
 ama_plan_column:0 "Personal plan"
 ama_plan_summary:0 "Personal: [GetPlayer.MakeScope.Var('ama_plan_used').GetValue|0] / [GetPlayer.MakeScope.Var('ama_plan_limit').GetValue|0] · Plan slots: [GetPlayer.MakeScope.Var('ama_plan_capacity').GetValue|0]"
 ama_plan_help:0 "Shows the personal creation plan only: deduct other occupied slots from the native cap, then apportion by weights. Temporarily unrecruitable categories keep their slots. Title creation is paused and never uses personal slots. Changing weights neither recruits nor charges."
 ama_categories_closed:0 "▸ Add troop categories"
 ama_categories_open:0 "▾ Close category menu"
 ama_categories_help:0 "Expand categories outside the creation plan and add one with weight 1. Categories do not disappear when money is low or slots are full. Recruitment eligibility is checked when acting."
 ama_add_help:0 "Adds this category to the creation plan at weight 1; adjust with − / +. Preferences only, no immediate recruitment or charge. Locked categories can be pre-configured and keep their reserved slots."
 ama_strategy_label:0 "New regiment selection"
 ama_strategy_0:0 "Value for money"
 ama_strategy_1:0 "Army quality"
 ama_strategy_2:0 "Quantity"
 ama_strategy_help:0 "Compare recruitable units within the same class. Read current unstationed recruitment-preview stats once per check cycle and reuse them within that cycle; a new manual or monthly check refreshes them, including era and character bonuses. Personal and title troops share this basis; stationing and title-specific bonuses are excluded. Quantity uses one-level cost and upkeep; value uses regiment strength / (fee + 60 months of upkeep); quality uses sqrt(damage * toughness) per soldier and ranks siege weapons on a regiment basis. Break ties by siege, pursuit and screen. Stop the pass if reading fails."
 ama_fees_label:0 "Fees and recruitment budget"
 ama_cost_label:0 "Cost (all resources)"
 ama_cost_help:0 "Charge the active unit definition base cost times this percentage; 0% is free. Extra character discounts remain excluded. The sync launcher refreshes the catalogue and cost definitions before starting the game. The game handles ongoing upkeep."
 ama_upkeep_label:0 "Upkeep limit (0: off)"
 ama_upkeep_help:0 "Stops expanding when unraised upkeep reaches this share of income; 0 ignores the limit. Governments without normal upkeep skip it. Only gold, prestige and treasury ratios with actual upkeep are checked; reserves are judged separately and one operation may slightly exceed the line."
 ama_percent_step:0 "Adjust by 10 percentage points, from 0% to 100%."
 ama_budget_closed:0 "▸ Payment and resource reserves"
 ama_budget_open:0 "▾ Payment and resource reserves"
 ama_budget_help:0 "Expand or collapse advanced budget settings. They remain active while collapsed."
 ama_wallet_label:0 "Payment resource"
 ama_wallet_help:0 "Follows each unit's native resource by default (prestige ×2, barter goods ×1, otherwise gold); title troops follow the treasury rule. Manual choices override. Affects creation and expansion payments only, not upkeep."
 ama_reserves_label:0 "Minimum balances after payment"
 ama_reserves_help:0 "Payments must leave at least these balances for every charged resource. Only player resources are used. Reserves for uncharged resources do not block payments in other resources."
 ama_reserve_step:0 "Adjust by 100, with a minimum of zero."
 ama_reserve_step_label:0 "±100"
 ama_currency_gold:0 "Gold"
 ama_currency_treasury:0 "Treasury"
 ama_currency_prestige:0 "Prestige"
 ama_currency_piety:0 "Piety"
 ama_currency_barter_goods:0 "Barter Goods"
 ama_notes:0 "At most 1 action per day and 20 per month; confirmation next day.\nBase cost times fee percentage; the game handles upkeep.\nAfter game or mod changes, start through the sync launcher."
 ama_compatibility_help:0 "Does not override native troop types, governments or windows. Added types need an adapter; if another mod changes headcount, stats or fees, catalog scores and charges may not match. Native eligibility is kept and no reinforcements are forced."
