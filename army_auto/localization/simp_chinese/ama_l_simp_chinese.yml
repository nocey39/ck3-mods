 setting_ama_preset_title_expand_mode_1_desc:0 "扩编已选类别的自持头衔兵士，逐队读取原版上限。不处理借调、已集结或战斗中的部队。"
 setting_ama_preset_title_expand_mode_2:0 "开启"
 setting_ama_preset_title_expand_mode_2_desc:0 "扩编已选类别的自持头衔兵士，逐队读取原版上限。不处理借调、已集结或战斗中的部队。"
 rule_ama_preset_replace_enabled:0 "自动解散不符配置的军团"
 setting_ama_preset_replace_enabled_0:0 "关闭"
 setting_ama_preset_replace_enabled_0_desc:0 "默认关闭。开启后，只在允许新建的私人／头衔来源中，和平且军团未集结、未参战时先解散不符配置的军团。0份或未选类别也拆；已选类别按当前策略比较可招募兵种，不再要求20%提升，评分完全相同时保留旧兵。满编、缺钱或达到维护停止线均不拦拆；拆后按原预算正常补招，可能暂时缺兵。每天一次、每月20次与新建扩编共用额度；不因正数配比超配裁军。特殊、事件、雇佣、借调和非玩家军团不处理；已选类别中的未知兵种保留。"
 setting_ama_preset_replace_enabled_1:0 "开启"
 setting_ama_preset_replace_enabled_1_desc:0 "默认关闭。开启后，只在允许新建的私人／头衔来源中，和平且军团未集结、未参战时先解散不符配置的军团。0份或未选类别也拆；已选类别按当前策略比较可招募兵种，不再要求20%提升，评分完全相同时保留旧兵。满编、缺钱或达到维护停止线均不拦拆；拆后按原预算正常补招，可能暂时缺兵。每天一次、每月20次与新建扩编共用额度；不因正数配比超配裁军。特殊、事件、雇佣、借调和非玩家军团不处理；已选类别中的未知兵种保留。"
