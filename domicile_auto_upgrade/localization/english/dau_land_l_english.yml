l_english:
 dau_land_settings_decision:0 "Territory auto-upgrade settings"
 dau_land_settings_decision_desc:0 "Open the domain auto upgrade panel: enable, scope, interval, batch and cost ratio. Upgrades existing buildings only."
 dau_land_settings_decision_tooltip:0 "Open territory auto-upgrade settings"
 dau_land_settings_decision_confirm:0 "Open settings"
 dau_land_panel_title:0 "Territory auto-upgrade"
 dau_land_enabled_label:0 "Enable territory construction"
 dau_land_enabled_help:0 "Checks at once when enabled, then at the chosen interval. Economic planning prioritizes development, new construction and upgrades in your domain using estimated returns and market supply."
 dau_land_status_display:0 "Last check: [GetPlayer.Custom('dau_land_status_text')]"
 dau_land_status_off:0 "Paused"
 dau_land_status_ready:0 "Awaiting check"
 dau_land_status_done:0 "Converted [GetPlayer.MakeScope.Var('dau_land_last_feudalized').GetValue|0] · Upgrades [GetPlayer.MakeScope.ScriptValue('dau_land_last_upgraded_count')|0] · Slots [GetPlayer.MakeScope.Var('dau_land_last_built').GetValue|0] · Begun [GetPlayer.MakeScope.Var('dau_land_last_created').GetValue|0] · Replaced [GetPlayer.MakeScope.Var('dau_land_last_replaced').GetValue|0]"
 dau_land_status_no_scope:0 "No territory group selected"
 dau_land_status_none:0 "No eligible project"
 dau_land_status_budget:0 "Insufficient resources after reserves"
 dau_land_status_failed:0 "Action failed; no payment taken"
 dau_land_reserve_heading:0 "Player reserves after payment"
 dau_land_reserve_help:0 "You pay everything; vassal resources are never used. When the government allows treasury instead of gold, land costs draw on treasury and check that reserve without falling back to private gold. Both builders share the higher floors. Piety and influence are balance-only checks."
 dau_land_scope_title:0 "Territory groups; select any"
 dau_land_group_1:0 "Personal"
 dau_land_group_2:0 "County others"
 dau_land_group_3:0 "Other vassals"
 dau_land_scope_help:0 "Personal: holdings you own. County holdings: other holdings inside your personally held counties. Other vassals: remaining direct or indirect vassal holdings. Select independently; this is the priority order. Empty baronies follow their county owner. De jure geography controls scheduling, not a filter requiring held titles."
 dau_land_category_title:0 "Empty slots; order of activation"
 dau_land_category_help:0 "Slot composition and composite ranking are evaluated per holding; upgrades use incremental utility. Use the slot-plan controls."
 dau_land_previous:0 "‹"
 dau_land_next:0 "›"
 dau_land_feudalize_label:0 "Auto-feudalize holdings"
 dau_land_feudalize_help:0 "Off by default. Within the selected groups, converts eligible tribal, nomadic and herder holdings to castles first, and Mandala vassals to temple citadels. Native government and construction requirements apply; conversion is instant and drops old buildings invalid for the new type. Shares cost percentage, reserves and batch limits with ordinary construction."
 dau_land_new_holding_help:0 "Off by default. The assistant automatically chooses from eligible holding types. With economic planning enabled, new holdings compete with other projects in your domain based on market supply and estimated returns. The assistant can leave an empty barony for a later check."
 dau_land_batch_title:0 "Maximum holdings per check"
 dau_land_batch_5:0 "5 holdings"
 dau_land_batch_10:0 "10 holdings"
 dau_land_batch_20:0 "20 holdings"
 dau_land_batch_help:0 "Feudalization, upgrades, ordinary slots and new holdings share this limit over distinct baronies, at most once per barony per day. The player balance is rechecked after each payment."
 dau_land_interval_1:0 "Monthly"
 dau_land_interval_2:0 "Half-yearly"
 dau_land_interval_4:0 "Yearly"
 dau_land_check_help:0 "Check for projects now. Holding development and other construction share the batch limit, cost percentage and reserves."
 dau_land_rules_summary:0 "Instant buildings; native holding time; player pays"
 dau_land_rules_note:0 "Construction follows the holding owner's native requirements. Authorize development for the assistant to choose holding types automatically. You start the first tier of duchy buildings and the assistant can upgrade them. Settings transfer to the next played character on death."
 dau_land_price_note:0 "Feudalization, ordinary buildings and new holdings share this page's percentage and reserves. Extra modifiers are not read; gold and treasury follow government rules. Budget and payment use the same price, charged after conversion or completion. Cancelling a new holding gives no refund."
 dau_land_value_gold:0 "[GetPlayer.MakeScope.Var('dau_land_gold_reserve').GetValue|0]"
 dau_land_value_treasury:0 "[GetPlayer.MakeScope.Var('dau_land_treasury_reserve').GetValue|0]"
 dau_land_value_prestige:0 "[GetPlayer.MakeScope.Var('dau_land_prestige_reserve').GetValue|0]"
 dau_land_category_economy:0 "[GetPlayer.Custom('dau_land_category_economy_text')]"
 dau_land_category_economy_off:0 "Economy"
 dau_land_category_economy_on:0 "[GetPlayer.MakeScope.Var('dau_land_category_economy').GetValue|0] Economy"
 dau_land_category_military:0 "[GetPlayer.Custom('dau_land_category_military_text')]"
 dau_land_category_military_off:0 "Military"
 dau_land_category_military_on:0 "[GetPlayer.MakeScope.Var('dau_land_category_military').GetValue|0] Military"
 dau_land_category_defense:0 "[GetPlayer.Custom('dau_land_category_defense_text')]"
 dau_land_category_defense_off:0 "Defense"
 dau_land_category_defense_on:0 "[GetPlayer.MakeScope.Var('dau_land_category_defense').GetValue|0] Defense"
 dau_land_cost_value:0 "[GetPlayer.MakeScope.Var('dau_land_cost_percent').GetValue|0]%"
 dau_land_replace_label:0 "Replace unselected types (retired)"
 dau_land_replace_help:0 "Retired. Existing saves keep the stored setting, but no replacement construction runs."
 dau_land_status_replace_failed:0 "Replacement is retired; no replacement fee was charged."
 dau_land_ui_costs:0 "Cost settings"
 dau_land_reserve_summary:0 "@gold_icon![GetPlayer.MakeScope.Var('dau_land_gold_reserve').GetValue|0]   @treasury_icon![GetPlayer.MakeScope.Var('dau_land_treasury_reserve').GetValue|0]   @prestige_icon![GetPlayer.MakeScope.Var('dau_land_prestige_reserve').GetValue|0]"
 dau_land_plan_label:0 "Slot plan"
 dau_land_plan_value:0 "[GetPlayer.Custom('dau_land_plan_text')]"
 dau_land_plan_help:0 "Counts ordinary buildings separately per holding. Economic focus aims near 2:1, military the reverse, balanced near 1:1; tighter slots round off and an unavailable group may be backfilled, but pure modes never cross groups. Main, special and unknown buildings are not counted."
 dau_land_plan_defense_label:0 "Defense buildings first"
 dau_land_plan_defense_help:0 "Prioritize eligible affordable defenses, outside the economic/military mix. May be enabled with the slot plan off."
 dau_land_plan_0:0 "Off"
 dau_land_plan_1:0 "Economy only"
 dau_land_plan_2:0 "Economy focus"
 dau_land_plan_3:0 "Balanced"
 dau_land_plan_4:0 "Military focus"
 dau_land_plan_5:0 "Military only"
 dau_land_region_title:0 "De jure range"
 dau_land_region_enabled_label:0 "Limit construction to held titles’ de jure land"
 dau_land_region_duchy:0 "Duchies"
 dau_land_region_kingdom:0 "Kingdoms"
 dau_land_region_empire:0 "Empires"
 dau_land_region_help:0 "Off by default. Union the de jure counties of your held titles at checked tiers, excluding foreign land, then apply the existing ownership groups. Overlap is deduplicated. No checked tier, matching title or domestic land means no construction. Personal holdings outside the range are also excluded. Recollect every check; no persistent range cache."
 dau_land_region_empty_label:0 "No domestic land in the selected de jure range; check title tiers and ownership"
 dau_ui_interval_7:0 "Weekly"
 dau_land_interval_7:0 "Weekly"
 dau_land_schedule_help:0 "Weekly checks every 7 game days; monthly uses a monthly delay. Six-month and yearly modes use 2 or 4 quarterly pulses. Changing the interval restarts the timer. The 5/10/20 per-check limits and once-per-holding-per-day rule remain."
 dau_ui_interval_3:0 "3 days"
 dau_land_interval_3:0 "3 days"
 dau_land_three_day_schedule_help:0 "Check every 3 days, every 7 days or monthly. Old six-month/yearly preferences become monthly. Changing the interval restarts the timer; batch limits and once-per-holding-per-day restrictions remain."
 dau_land_zone_title:0 "Automatic regional progression"
 dau_land_zone_order:0 "Personal first → County holdings → Other vassals"
 dau_land_zone_progress:0 "[GetPlayer.Custom('dau_land_zone_progress_text')]"
 dau_land_zone_ready_text:0 "Personal holdings first, then concentrated regional construction"
 dau_land_zone_focus_text:0 "Vassal region: [GetPlayer.MakeScope.Var('dau_land_zone_focus').Title.GetName]"
 dau_land_zone_idle_text:0 "No current work; automatic checks rest. Check now bypasses the wait."
 dau_land_zone_help:0 "Personal holdings first, then other holdings in your counties. Other vassals progress by de jure kingdom and duchy, without requiring you to hold those titles. Missing ancestry uses smaller regions. Day-blocked regions remain in focus; unavailable or unaffordable regions may yield temporarily. When no current work remains, automatic checks rest about 30 days. All groups share the batch limit; demolition still requires its own switch."
 dau_land_zone_group_1_label:0 "Personal"
 dau_land_zone_group_2_label:0 "County land"
 dau_land_zone_group_3_label:0 "Other vassals"
