l_english:
 rconq_cb_name: "Regional Casus Belli"
 rconq_war_name: "$ORDER$Regional Conquest War"
 rconq_region_conquest: "Regional Casus Belli"
 rconq_region_conquest_desc: "Select one or more de jure regions of the same tier in the matching conquest casus belli. Other independent realms with land in those regions join one defensive war. Victory directly grants their counties and subordinate baronies in that region to you. Available to every human-controlled character, regardless of government or landed status; no fame requirement or declaration cost. Create or usurp higher titles yourself."
 rconq_victory_desc: "Take the foreign counties in the selected region, processing their baronies with the native transfer parameter. Your realm, land outside the region and higher titles are unchanged. This war creates no new truces."
 rconq_white_peace_desc: "Both sides retain their territory. This war creates no new truces."
 rconq_defeat_desc: "The selected region is not conquered. Both sides retain their territory; normal defeat legitimacy effects apply. This war creates no new truces or additional indemnity."
 rconq_invalidated_desc: "No defending realm in this war still holds a county inside the selected de jure regions. The regional conquest war ends."
 rconq_empire_cb_name: "De Jure Empire Conquest"
 rconq_empire_war_name: "$ORDER$De Jure Empire Conquest War"
 rconq_empire_conquest: "De Jure Empire Conquest"
 rconq_empire_conquest_desc: "Select one de jure empire region and bring its other independent realms into one war. Victory directly takes foreign counties, processing their baronies with the native transfer parameter. Player only, any government, no fame threshold. Configure costs and truces through the settings decision; defaults are free wars and no new truces. Create or usurp higher titles yourself."
 rconq_kingdom_cb_name: "De Jure Kingdom Conquest"
 rconq_kingdom_war_name: "$ORDER$De Jure Kingdom Conquest War"
 rconq_kingdom_conquest: "De Jure Kingdom Conquest"
 rconq_kingdom_conquest_desc: "Select one de jure kingdom region and bring its other independent realms into one war. Victory directly takes foreign counties, processing their baronies with the native transfer parameter. Player only, any government, no fame threshold. Configure costs and truces through the settings decision; defaults are free wars and no new truces. Create or usurp higher titles yourself."
 rconq_duchy_cb_name: "De Jure Duchy Conquest"
 rconq_duchy_war_name: "$ORDER$De Jure Duchy Conquest War"
 rconq_duchy_conquest: "De Jure Duchy Conquest"
 rconq_duchy_conquest_desc: "Select one de jure duchy region and bring its other independent realms into one war. Victory directly takes foreign counties, processing their baronies with the native transfer parameter. Player only, any government, no fame threshold. Configure costs and truces through the settings decision; defaults are free wars and no new truces. Create or usurp higher titles yourself."
 rconq_neighboring_realm_tt: "The target realm must border your realm by land or a native sea adjacency. The defender does not need to hold the corresponding higher title"
 rconq_legacy_victory_desc: "Take the defending participants' counties and subordinate baronies inside the selected de jure regions. Your realm's existing territory and territory outside the regions remain unchanged. Duchy, kingdom and empire titles are not transferred. Establish normal truces."
 rconq_region_invalidated_desc: "The primary defender no longer holds any county in the selected de jure region. The regional conquest war ends."
 rconq_legacy_white_peace_desc: "Both sides retain their territory and establish normal truces."
 rconq_legacy_defeat_desc: "The selected regions are not conquered. Both sides retain their territory; normal defeat legitimacy effects and truces apply. No additional indemnity."
 decision_group_type_rconq_configuration: "Regional Conquest"
 rconq_settings_decision: "Regional Casus Belli Settings"
 rconq_settings_decision_desc: "Configure regional conquest costs and post-war truces. Defaults: free wars and no new truces. Saved with the campaign and inherited after your character dies."
 rconq_settings_decision_tooltip: "Open regional conquest settings"
 rconq_settings_decision_confirm: "Open settings"
 rconq_panel_title: "Regional Casus Belli Settings"
 rconq_settings_intro: "Select one duchy, kingdom or empire region per war. These settings are independent. Both start unchecked: free wars and no new truces."
 rconq_costs_label: "Use holy-war piety costs"
 rconq_costs_help: "Off: free. On: base 200 piety for a duchy, 750 for a kingdom, with native holy-war cost modifiers. Empire costs twice the final kingdom cost: base 1500. Base gold and prestige costs stay zero."
 rconq_truces_label: "Use normal post-war truces"
 rconq_truces_help: "Off: no new truces. On: normal truces with all defenders (usually 5 years, modified by native rules). Existing truces stay."
 rconq_settings_saved_note: "Saved with this campaign; inherited on succession. Applies to new declarations. Reopen the declaration window after changing settings."
 rconq_settings_reset: "Reset: free, no truces"
 rconq_settings_reset_help: "Turn both settings off. Existing wars and truces are unchanged."
 rconq_settings_done: "Done"
 rconq_victory_truce_desc: "Take the foreign counties in the selected region, processing their baronies with the native transfer parameter. Your realm, land outside the region and higher titles are unchanged. This war establishes normal truces."
 rconq_white_peace_truce_desc: "Both sides retain their territory and establish normal truces."
 rconq_defeat_truce_desc: "The selected region is not conquered. Both sides retain their territory; normal defeat legitimacy effects and truces apply. No additional indemnity."
 rconq_empire_conquest_truce: "De Jure Empire Conquest"
 rconq_empire_conquest_truce_desc: "Select one de jure empire region and bring its other independent realms into one war. Victory directly takes foreign counties, processing their baronies with the native transfer parameter. Player only, any government, no fame threshold. Configure costs and truces through the settings decision; defaults are free wars and no new truces. Create or usurp higher titles yourself."
 rconq_kingdom_conquest_truce: "De Jure Kingdom Conquest"
 rconq_kingdom_conquest_truce_desc: "Select one de jure kingdom region and bring its other independent realms into one war. Victory directly takes foreign counties, processing their baronies with the native transfer parameter. Player only, any government, no fame threshold. Configure costs and truces through the settings decision; defaults are free wars and no new truces. Create or usurp higher titles yourself."
 rconq_duchy_conquest_truce: "De Jure Duchy Conquest"
 rconq_duchy_conquest_truce_desc: "Select one de jure duchy region and bring its other independent realms into one war. Victory directly takes foreign counties, processing their baronies with the native transfer parameter. Player only, any government, no fame threshold. Configure costs and truces through the settings decision; defaults are free wars and no new truces. Create or usurp higher titles yourself."
