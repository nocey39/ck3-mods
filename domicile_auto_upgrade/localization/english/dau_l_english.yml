l_english:
 dau_settings_decision:0 "Domicile Auto Upgrade Settings"
 dau_settings_decision_desc:0 "Manage automatic construction and upgrades for domiciles. Enable manual selection to choose new buildings and upgrade branches through events."
 dau_settings_decision_tooltip:0 "Open the independent settings panel"
 dau_settings_decision_confirm:0 "Open settings"
 dau_panel_title:0 "Domicile Auto Construction"
 dau_enabled_label:0 "Enable auto construction"
 dau_enabled_help:0 "Checks immediately when enabled, then follows the selected interval. Disabling stops new automatic projects; existing construction continues."
 dau_minus:0 "−"
 dau_plus:0 "+"
 dau_reserve_title:0 "Resource reserves"
 dau_reserve_hint:0 "Keep after upgrading"
 dau_reserve_heading:0 "Resource reserves · Keep after upgrading"
 dau_reserve_help:0 "After payment, each spent resource must remain at or above its reserve. Only resources used by this project are checked. Zero means no extra reserve."
 dau_label_gold:0 "Gold"
 dau_label_treasury:0 "Treasury"
 dau_label_prestige:0 "Prestige"
 dau_label_herd:0 "Herd"
 dau_step_label_100:0 "±100"
 dau_step_label_1000:0 "±1,000"
 dau_step_100:0 "Adjust by 100. Reserves cannot go below zero."
 dau_step_1000:0 "Adjust by 1,000. Reserves cannot go below zero."
 dau_interval_title:0 "Interval"
 dau_interval_help:0 "Monthly uses a player-only delayed check; half-yearly and yearly use 2 or 4 quarterly pulses. Changing the interval resets the timer."
 dau_interval_1:0 "Monthly"
 dau_interval_2:0 "Half-yearly"
 dau_interval_4:0 "Yearly"
 dau_priority_title:0 "Priority"
 dau_priority_1:0 "Main building first"
 dau_priority_0:0 "Lower cost first"
 dau_priority_help:0 "Main building first considers affordable main buildings before other upgrades. Lower cost first compares gold plus treasury costs; other resources are not converted to gold."
 dau_check_now:0 "Check now"
 dau_check_help:0 "Check available projects now. Eligible empty slots or branches prompt a choice when manual selection is enabled. Only one project can be built at a time."
 dau_manual_choice_label:0 "Manual selection"
 dau_manual_choice_help:0 "Enable choice events for certain empty slots and upgrade branches. When disabled, projects start automatically according to construction priorities and resource reserves."
 dau_status_display:0 "Status: [GetPlayer.Custom('dau_status_text')]"
 dau_status_none:0 "No domicile"
 dau_status_off:0 "Paused"
 dau_status_building:0 "Construction in progress"
 dau_status_unsupported:0 "Unsupported domicile type"
 dau_status_failed:0 "Could not start; no payment taken"
 dau_status_budget:0 "Resources or reserves insufficient"
 dau_status_no_candidate:0 "No eligible projects"
 dau_status_ready:0 "Waiting for the next check"
 dau_status_choice:0 "Waiting for a construction choice"
 dau_status_help:0 "Status: [GetPlayer.Custom('dau_status_text')]. Waits for construction or a pending choice. No available project can mean maximum tier, unmet requirements or deferred reminders."
 dau_rules_summary:0 "Automatic construction and manual selection"
 dau_price_summary:0 "Preview: automatic costs (info)"
 dau_rules_note:0 "Automatic construction starts one project at a time. With manual selection enabled, events offer certain affordable new buildings and upgrade branches. Choosing Later delays the reminder for at least one year. Settings follow the domicile."
 dau_price_note:0 "Automatic construction uses base building costs and native timing. Cost-script conditions are evaluated, but engine discounts or surcharges are not included. Cancellation follows native refunds and may differ from the payment."
 dau_choice_next:0 "Next page"
 dau_choice_previous:0 "Previous page"
 dau_choice_later:0 "Remind later (at least a year)"
 dau_reset_choice_decision:0 "Reset Domicile Construction Reminders"
 dau_reset_choice_decision_desc:0 "Clear postponed reminders for this domicile and ask about construction again. Existing buildings and construction remain intact. Checks immediately if automation is enabled."
 dau_reset_choice_decision_tooltip:0 "Ask again about this domicile’s new buildings and branches"
 dau_reset_choice_decision_confirm:0 "Reset reminders"
 dau_cost_value:0 "[GetPlayer.GetDomicile.MakeScope.Var('dau_cost_percent').GetValue|0]%"
 dau_value_gold:0 "[GetPlayer.GetDomicile.MakeScope.Var('dau_gold_reserve').GetValue|0]"
 dau_value_treasury:0 "[GetPlayer.GetDomicile.MakeScope.Var('dau_treasury_reserve').GetValue|0]"
 dau_value_prestige:0 "[GetPlayer.GetDomicile.MakeScope.Var('dau_prestige_reserve').GetValue|0]"
 dau_value_herd:0 "[GetPlayer.GetDomicile.MakeScope.Var('dau_herd_reserve').GetValue|0]"
 dau_cost_label:0 "Construction cost (all resources)"
 dau_cost_step:0 "Adjust by 10 percentage points; range 0–100%."
 dau_cost_help:0 "Adjust by 10 percentage points and save at once. Range 0–100%, default 100%; zero waives all costs. Domicile and territory are separate. Costs are already scaled by domicile percentage, without extra modifiers; budget and payment use that value. Native cancellation refunds may differ."
 dau_ui_construction:0 "Construction settings"
