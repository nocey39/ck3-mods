l_simp_chinese:
 rconq_cb_name: "区域宣战理由"
 rconq_war_name: "$ORDER$区域征服战争"
 rconq_region_conquest: "区域宣战理由"
 rconq_region_conquest_desc: "在对应等级的征服借口中选择一个或多个同级法理区域，将区域内持有土地的其他独立国家拉入同一场战争。胜利后直接取得参战防守方在所选区域内的伯爵领及下属男爵领。无威望门槛，宣战费用为零，所有玩家操控角色均可使用，不限制政体。高级头衔由玩家自行创建或篡夺。"
 rconq_victory_desc: "取得所选法理区域内的非己方伯爵领，并按原版参数连带处理男爵领。己方和区域外土地、高级头衔不转移。本场战争不产生新的停战协议。"
 rconq_white_peace_desc: "双方保留现有土地。本场战争不产生新的停战协议。"
 rconq_defeat_desc: "你未能征服所选区域，双方保留现有土地，按原版规则处理战败合法性。本场战争不产生新的停战协议，没有额外赔款。"
 rconq_invalidated_desc: "所选法理区域内已没有本场战争防守方持有的伯爵领，区域征服战争结束。"
 rconq_empire_cb_name: "帝国法理征服"
 rconq_empire_war_name: "$ORDER$帝国法理征服战争"
 rconq_empire_conquest: "帝国法理征服"
 rconq_empire_conquest_desc: "选择一个帝国法理区域，将其中其他独立国家拉入同一场战争。胜利直接取得区域内非己方伯爵领，并按原版参数连带处理男爵领。仅玩家可用，不限政体，无威望等级门槛。费用与停战可在决议设置中调整，默认免费、无新停战。高级头衔由玩家自行创建或篡夺。"
 rconq_kingdom_cb_name: "王国法理征服"
 rconq_kingdom_war_name: "$ORDER$王国法理征服战争"
 rconq_kingdom_conquest: "王国法理征服"
 rconq_kingdom_conquest_desc: "选择一个王国法理区域，将其中其他独立国家拉入同一场战争。胜利直接取得区域内非己方伯爵领，并按原版参数连带处理男爵领。仅玩家可用，不限政体，无威望等级门槛。费用与停战可在决议设置中调整，默认免费、无新停战。高级头衔由玩家自行创建或篡夺。"
 rconq_duchy_cb_name: "公国法理征服"
 rconq_duchy_war_name: "$ORDER$公国法理征服战争"
 rconq_duchy_conquest: "公国法理征服"
 rconq_duchy_conquest_desc: "选择一个公国法理区域，将其中其他独立国家拉入同一场战争。胜利直接取得区域内非己方伯爵领，并按原版参数连带处理男爵领。仅玩家可用，不限政体，无威望等级门槛。费用与停战可在决议设置中调整，默认免费、无新停战。高级头衔由玩家自行创建或篡夺。"
 rconq_neighboring_realm_tt: "宣战对象必须与你的领国陆地邻接，或由游戏原生规则认定为跨海邻接；此条件不要求对方持有对应高级头衔"
 rconq_legacy_victory_desc: "取得所选法理区域内、实际参战防守方持有的伯爵领及下属男爵领。原有己方土地不变，区域外土地不变，公国、王国和帝国头衔不转移。建立正常停战协议。"
 rconq_region_invalidated_desc: "所选法理区域内已没有主要防守方持有的伯爵领，区域征服战争结束。"
 rconq_legacy_white_peace_desc: "双方保留现有土地，建立正常停战协议。"
 rconq_legacy_defeat_desc: "你未能征服所选区域，双方保留现有土地，按原版规则处理战败合法性及停战协议。没有额外赔款。"
 decision_group_type_rconq_configuration: "区域征服"
 rconq_settings_decision: "区域宣战理由设置"
 rconq_settings_decision_desc: "调整区域征服的宣战费用与战后停战。默认免费、无新停战；设置随存档保存，并在玩家角色死亡后的继承中延续。"
 rconq_settings_decision_tooltip: "打开区域征服设置窗口"
 rconq_settings_decision_confirm: "打开设置"
 rconq_panel_title: "区域宣战理由设置"
 rconq_settings_intro: "每次选择一个公国、王国或帝国区域。两项设置相互独立；默认均不勾选，即免费且不产生新停战。"
 rconq_costs_label: "按圣战标准收取虔诚费用"
 rconq_costs_help: "关闭：免费。开启：公国基础 200、王国 750 虔诚，并采用原版对应圣战的费用修正。帝国费用为修正后王国费用的两倍，基础 1500。金币与威望基础费用均为零。"
 rconq_truces_label: "战争结束后生成正常停战"
 rconq_truces_help: "关闭：不新增停战。开启：主要目标与额外防守方采用原版停战时长，通常为 5 年，并受原版修正影响。已有停战不会被清除。"
 rconq_settings_saved_note: "设置随存档保存，角色死亡后的继承人沿用。改动只影响新宣战；设置后请重新打开宣战窗口。"
 rconq_settings_reset: "恢复默认：免费、无停战"
 rconq_settings_reset_help: "关闭两个开关；不影响已开战战争或已有停战。"
 rconq_settings_done: "完成"
 rconq_victory_truce_desc: "取得所选法理区域内的非己方伯爵领，并按原版参数连带处理男爵领。己方和区域外土地、高级头衔不转移。本场战争按正常规则建立停战协议。"
 rconq_white_peace_truce_desc: "双方保留现有土地，按正常规则建立停战协议。"
