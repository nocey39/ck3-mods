 teq_preview_share: "[Divide_CFixedPoint(TreasuryBudgetChangeWindow.GetNewBudgetTotal( GuiLawGroup.Self ), Max_CFixedPoint(TreasuryBudgetChangeWindow.GetNewBudgetTotalSum, '(CFixedPoint)0.001'))|%0]"
 teq_preview_law_name: "[TreasuryBudgetChangeWindow.AccessSelectedLaw( GuiLawGroup.AccessSelf ).GetLaw.GetShortName]"
 teq_preview_trend: "[Add_CFixedPoint(Subtract_CFixedPoint(Select_CFixedPoint(GetScriptedGui('teq_budget_shared_ui').IsShown(GuiScope.SetRoot(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope).End), TreasuryBudgetChangeWindow.GetCurrentBudgetTotal(GuiLawGroup.Self), TreasuryBudgetChangeWindow.GetNewBudgetTotal(GuiLawGroup.Self)), TreasuryBudgetChangeWindow.GetNewBudgetTotal(GuiLawGroup.Self)), TreasuryBudgetChangeWindow.GetBudgetTotalDiff(GuiLawGroup.Self))|2+=]"
 teq_preview_base_gold: "[gold_i][Select_CFixedPoint(GetScriptedGui('teq_budget_shared_ui').IsShown(GuiScope.SetRoot(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope).End), TreasuryBudgetChangeWindow.GetCurrentBudgetBaseRate(GuiLawGroup.Self), TreasuryBudgetChangeWindow.GetNewBudgetBaseRate(GuiLawGroup.Self))|2]"
 teq_preview_base_treasury: "[treasury_i][Select_CFixedPoint(GetScriptedGui('teq_budget_shared_ui').IsShown(GuiScope.SetRoot(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope).End), TreasuryBudgetChangeWindow.GetCurrentBudgetBaseRate(GuiLawGroup.Self), TreasuryBudgetChangeWindow.GetNewBudgetBaseRate(GuiLawGroup.Self))|2]"
 teq_current_envelope: "Monthly budget (including salaries): [treasury_i][TreasuryBudgetChangeWindow.GetTitle.MakeScope.Var('teq_total_budget').GetValue|1]"
 teq_retained_target: "Central monthly surplus target: [treasury_i][TreasuryBudgetChangeWindow.GetTitle.MakeScope.Var('teq_retained_flow').GetValue|1] ([TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_retained_income_fraction')|%0] of net treasury after expenses)"
 teq_reserve_flow: "Treasury reserve"
 teq_budget_explanation: "All arrows: left click changes 1 percentage point; right click changes 5. Changes apply immediately. Development and military shares trade within their common pool. Salary controls adjust pay standards, not a share of that pool; total salaries remain capped at 10% of the monthly budget. Treasury reserve and private income are separate settings."
 teq_native_surplus_diff: "[TreasuryBudgetChangeWindow.GetBudgetSurplusDiff()|1+=]"
 teq_empty: " "
 teq_apply_allocation: "Enact Budget Edict"
 teq_allocation_effects: "Salaries retain automatic growth with a manual adjustment. 100% means one base salary; range 0% to 200%. Total salaries remain capped at 10% of the budget.\n\nDevelopment and military shares trade within their common pool.\n\nLeft click changes 1 percentage point; right click changes 5. Changes apply immediately.\n\nThe budget edict separately retains native costs and political effects."
 teq_vanilla_effects: "[TreasuryBudgetChangeWindow.GetBudgetEnactEffectDescription]"

 teq_reserve_adjust_help: "Share of net monthly treasury (after deducting Men-at-Arms, court positions, and other central expenses) kept unallocated in the central treasury. Default: 5%; range: 0% to 100%. Left click changes 1 percentage point; right click changes 5. Free, immediate, and saved."

 teq_private_share: "Private income"
 teq_private_reset: "Reset 5%"
 teq_private_adjust_help: "Native eligible income, including domain taxes, vassal taxes, and tribute, defaults to 5% personal gold and 95% treasury. Estate income, salaries, and other channels retain native rules. Left click changes 1 percentage point; right click changes 5, from 0% to 100%. Free, immediate, and saved. Existing treasury funds remain unchanged. Public budgets adjust immediately. If unusual modifiers block the split, the previous effective split is kept and calibration retries later.\n\n[SelectLocalization(EqualTo_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_private_split_status_value'), '(CFixedPoint)1'), 'teq_private_status_applied', 'teq_private_status_pending')]"
 teq_private_status_applied: "Current split applied (actual private share: [Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_private_applied_fraction_value'), '(CFixedPoint)0.0005')|%1])."
 teq_private_status_pending: "Not yet verified: the previous split is retained. Retrying next month."

 teq_salary_tier: "[SelectLocalization(EqualTo_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_salary_tier_value'), '(CFixedPoint)0'), 'teq_salary_poor', SelectLocalization(EqualTo_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_salary_tier_value'), '(CFixedPoint)1'), 'teq_salary_normal', 'teq_salary_rich'))]"

 teq_salary_poor: "Low"

 teq_salary_normal: "Standard"

 teq_salary_rich: "High"

 teq_fixed_payroll: "Coordinated payroll"

 teq_live_budget_help: "Current paid budget. Adjusting a control recalculates payments immediately. Salaries follow office, rank, and salary standard, subject to the 10% budget cap. Development and military share their common pool. Expand the paid breakdown to see individual recipients."
 teq_current_budget_breakdown_title: "Current payments"
 teq_current_budget_breakdown_total: "Total: [treasury_i] [TreasuryBudgetChangeWindow.GetCurrentBudgetTotal(GuiLawGroup.Self)|1]"
 teq_current_budget_breakdown_note: "Current paid breakdown, using the same settlement as the amounts in the table. Empty when there is no actual expenditure or recipient."
 teq_all_current_treasury_expenses: "All current treasury expenses (hover)"
 teq_salary_coefficient: "[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_control_salary_fraction'), '(CFixedPoint)0.0005')|%1]"
 teq_salary_curve_help: "Salary standard: 100% means one base salary. Adjust the automatic standard manually, from 0% to 200%. Click the pay percentage to restore automatic pay. Left click changes 1 percentage point; right click changes 5. Changes apply immediately. The automatic baseline still grows smoothly with fiscal capacity, at most once per month. Total salaries remain capped at 10% of the monthly budget and are reduced when funds are insufficient. Actual payment per unit is shown under Base Rate."

 teq_control_allocation_header: "Share / Pay"

 teq_control_salary_label: "Salary standard"

 teq_control_development_display: "[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_control_development_share'), '(CFixedPoint)0.00005')|%0]"

 teq_control_military_display: "[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_control_military_share'), '(CFixedPoint)0.00005')|%0]"

 teq_control_cardinal_display: "[Add_CFixedPoint(TreasuryBudgetChangeWindow.GetTitle.GetHolder.MakeScope.ScriptValue('teq_control_cardinal_share'), '(CFixedPoint)0.0005')|%1]"



 teq_control_public_help: "Share of the common development and military pool. The two shares total 100%. Left click changes 1 percentage point; right click changes 5. A decrease in one adds the same share to the other, immediately. Any other public budget keeps its share before the common pool is divided. A category without actual recipients pays zero."

 teq_control_cardinal_help: "Retains the native cardinal share of the public budget. Development and military percentages divide their own common pool and do not include this category."

 teq_control_political_help: "Control changes have already taken effect. This button separately enacts the native budget edict, retaining native resource costs and political effects.\n\n[TreasuryBudgetChangeWindow.GetCanEnactBudgetDescription]"

 teq_control_window_title: "Treasury Allocation (Immediate)"

 teq_control_salary_reset_help: "Restore automatic pay: click this percentage to clear the manual adjustment and use the current automatic wage baseline. Total salaries remain subject to the 10% budget cap."
