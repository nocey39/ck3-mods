 rule_ama_preset_replace_enabled:0 "Disband units outside the configuration"
 setting_ama_preset_replace_enabled_0:0 "Off"
 setting_ama_preset_replace_enabled_0_desc:0 "Off by default. In creation-enabled personal/title pools, at peace and unraised/out of combat, disband units outside the selected categories or current strategy first. Zero-weight categories are removed too. No 20% threshold; exact ties keep the incumbent. Full capacity, insufficient funds or the upkeep stop line do not block disbanding. Normal budgeted recruitment follows, so forces may temporarily shrink. Shares one-per-day and 20-per-month allowance with creation/expansion. Positive-weight overrepresentation alone does not cause cuts. Special, event, hired, borrowed and foreign units are excluded; unknown types in selected categories are kept."
 setting_ama_preset_replace_enabled_1:0 "On"
 setting_ama_preset_replace_enabled_1_desc:0 "Off by default. In creation-enabled personal/title pools, at peace and unraised/out of combat, disband units outside the selected categories or current strategy first. Zero-weight categories are removed too. No 20% threshold; exact ties keep the incumbent. Full capacity, insufficient funds or the upkeep stop line do not block disbanding. Normal budgeted recruitment follows, so forces may temporarily shrink. Shares one-per-day and 20-per-month allowance with creation/expansion. Positive-weight overrepresentation alone does not cause cuts. Special, event, hired, borrowed and foreign units are excluded; unknown types in selected categories are kept."
